  function contenuRole() {
    elRole.textContent = '';
    elRole.className = 'role-voile' + (moi.role === 'tueur' ? ' tueur' : '');
    const d = el('div');
    const voc = pack.vocabulaire;
    if (moi.role === 'tueur') {
      d.appendChild(el('div', { className: 'titre-role' }, 'Tu es ' + voc.tueur));
      const sol = moi.solution;
      d.appendChild(el('p', {}, 'Tu as tué ' + pack.victime + ' dans ' + elementLe('lieux', sol.lieu) + ', avec ' + elementLe('armes', sol.arme) + '.'));
      d.appendChild(el('p', {}, 'Personne ne doit le découvrir avant la fin.'));
    } else {
      d.appendChild(el('div', { className: 'titre-role' }, 'Tu es ' + (voc.enqueteur ? 'un ' + voc.enqueteur : 'enquêteur')));
      d.appendChild(el('p', {}, 'Trouve qui, où et avec quoi. Méfie-toi : ' + voc.tueur + ' est parmi vous.'));
    }
    elRole.appendChild(d);
    // Même zone, même geste pour tout le monde : rien ne distingue le tueur de loin.
    if (etat.phase === 'enquete') elRole.appendChild(el('div', { className: 'zone-dossier' }, 'Glisse le doigt jusqu’ici et lâche pour ouvrir ton dossier.'));
  }
  // Un seul appui à la fois. Le doigt levé est écouté sur toute la page :
  // si l'écran est redessiné pendant l'appui (le bouton remplacé sous le
  // doigt), le rôle se recache quand même.
  function surZoneDossier(e) {
    const z = elRole.querySelector('.zone-dossier');
    if (!z || !elRole.classList.contains('ouvert')) return false;
    const r = z.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  }
  function finAppuiRole(e) {
    if (!appuiRole) return;
    clearTimeout(appuiRole.minuteur);
    ['pointerup', 'pointercancel'].forEach((t) => window.removeEventListener(t, finAppuiRole, true));
    window.removeEventListener('pointermove', bougerAppuiRole, true);
    appuiRole = null;
    const dossier = e && e.type === 'pointerup' && surZoneDossier(e);
    elRole.classList.remove('ouvert');
    if (rendreApresRole) { rendreApresRole = false; rendu = ''; afficher(); }
    if (dossier) ouvrirDossier();
  }
  function bougerAppuiRole(e) {
    const z = elRole.querySelector('.zone-dossier');
    if (z) z.classList.toggle('survol', surZoneDossier(e));
  }
  function brancherRole(cible) {
    cible.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      finAppuiRole();
      try { cible.setPointerCapture(e.pointerId); } catch (x) { /* pas grave */ }
      appuiRole = { minuteur: setTimeout(() => { contenuRole(); elRole.classList.add('ouvert'); }, 350) };
      ['pointerup', 'pointercancel'].forEach((t) => window.addEventListener(t, finAppuiRole, true));
      window.addEventListener('pointermove', bougerAppuiRole, true);
    });
    cible.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  // Filet de sécurité : toucher l'écran de rôle le referme, et il se cache
  // si l'appli passe en arrière-plan.
  elRole.addEventListener('click', () => { finAppuiRole(); elRole.classList.remove('ouvert'); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { finAppuiRole(); elRole.classList.remove('ouvert'); } });


  // ---------------- Dossier : enquêteur ou console du tueur ----------------
  function ouvrirDossier() {
    if (!etat || etat.phase !== 'enquete' || !moi.inscrit) return;
    dossierOuvert = true;
    rendreDossier();
  }
  function fermerDossier() {
    dossierOuvert = false;
    elDossier.classList.remove('ouvert');
    elDossier.textContent = '';
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) fermerDossier(); });
  let minuteurDossier = null;
  function rendreDossier() {
    clearInterval(minuteurDossier);
    if (!dossierOuvert || !etat || etat.phase !== 'enquete') { fermerDossier(); return; }
    const garde = elDossier.querySelector('.contenu');
    const defil = garde ? garde.scrollTop : 0;
    elDossier.textContent = '';
    elDossier.classList.add('ouvert');
    const h = el('header');
    const fermer = el('button', { type: 'button', className: 'discret' }, 'Fermer');
    fermer.addEventListener('click', fermerDossier);
    const tueur = moi.role === 'tueur' && moi.console;
    h.append(el('h2', {}, tueur ? 'Ta console' : 'Ton dossier'), fermer);
    const contenu = el('div', { className: 'contenu' });
    elDossier.append(h, contenu);
    if (tueur) consoleTueur(contenu); else dossierEnqueteur(contenu);
    contenu.scrollTop = defil;
  }
  function bloc(parent, titre) {
    const c = el('section', { className: 'carte' });
    if (titre) c.appendChild(el('h2', {}, titre));
    parent.appendChild(c);
    return c;
  }
  function dossierEnqueteur(contenu) {
    const archive = moi.archive || [];
    const c = bloc(contenu, 'Ta mission');
    c.appendChild(el('p', {}, 'Trouve qui, où et avec quoi avant l’heure butoir. ' + majusculeInit(pack.vocabulaire.tueur) +
      ' peut glisser de faux plis, retarder ton courrier ou lancer des rumeurs : seul le tampon d’une contre-expertise fait foi.'));
    const b = bloc(contenu, 'Ton bilan');
    b.appendChild(el('p', {}, archive.length + ' pli' + (archive.length > 1 ? 's' : '') + ' reçu' + (archive.length > 1 ? 's' : '') +
      ' · ' + archive.filter((e) => e.tampon).length + ' expertisé(s) · ' + (moi.accusations || []).length + ' accusation(s).'));
    b.appendChild(el('p', {}, majusculeInit(etat.unite) + 's cette heure : ' + moi.gorgees_heure + (etat.plafond ? '/' + etat.plafond : '') + '.'));
    b.appendChild(el('p', {}, 'Si ' + (pack.narrateur ? pack.narrateur.nom : 'le narrateur') + ' annonce une interférence, quelqu’un a été saboté : peut-être toi.'));
  }
  function majusculeInit(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  const NOMS_SABOTAGES = {
    fausse_piste: ['🃏 Fausse piste', 'Un faux pli, au même format que les vrais, qui écarte un élément de la vraie solution.'],
    interception: ['✉️ Interception', 'Le prochain pli de la cible arrivera avec du retard.'],
    ecoute: ['👂 Écoute', 'Tu lis le dernier pli reçu par la cible, sans laisser de trace.'],
    rumeur: ['🗣️ Fausse rumeur', 'Une rumeur anonyme qui accuse un innocent, vue par tous. Une seule par partie.'],
  };
  const NOMS_CATEGORIES = { suspect: 'Personnage', lieu: 'Lieu', arme: 'Arme' };
  const NOMS_RISQUES = { faible: 'risque faible', moyen: 'risque moyen', eleve: 'risque élevé' };
  function consoleTueur(contenu) {
    const k = moi.console;
    const pret = () => !k.prochain_sabotage_a || k.prochain_sabotage_a <= serveurMaintenant();
    // Réserve
    const r = bloc(contenu, 'Réserve');
    r.appendChild(el('div', { className: 'charges' }, '🔪'.repeat(k.charges) + '·'.repeat(Math.max(0, k.charges_max - k.charges))));
    r.appendChild(el('p', {}, k.charges + '/' + k.charges_max + ' charges · ' + moi.pe + ' PE. Une charge coûte ' + k.cout_charge + ' PE (autant qu’un indice de couverture).'));
    r.appendChild(el('p', {}, majusculeInit(etat.unite) + 's cette heure : ' + moi.gorgees_heure + (etat.plafond ? '/' + etat.plafond : '') + '.'));
    const ach = el('button', { type: 'button', disabled: k.charges >= k.charges_max || moi.pe < k.cout_charge }, 'Acheter une charge (' + k.cout_charge + ' PE)');
    ach.style.marginTop = '8px';
    ach.addEventListener('click', () => envoyer({ type: 'enq_charge' }));
    r.appendChild(ach);
    const etatS = el('p', { style: 'margin-top:8px' });
    r.appendChild(etatS);
    const majEtat = () => {
      const reste = (k.prochain_sabotage_a || 0) - serveurMaintenant();
      const gratuit = sab.sabotage === 'rumeur' && k.rumeur_gratuite;
      etatS.textContent = 'Détection actuelle : ' + Math.round(k.detection * 100) + ' %, elle baisse jusqu’à ' + Math.round(k.detection_fin * 100) +
        ' % d’ici la fin · ' + (reste > 0 ? 'prochain sabotage dans ' + mmss(reste) : 'prêt à saboter');
      const b = elDossier.querySelector('[data-saboter]');
      if (b) b.disabled = b.dataset.complet !== '1' || (!gratuit && (reste > 0 || k.charges < 1));
    };
    // Choix du sabotage
    const c = bloc(contenu, 'Sabotage');
    const ligne = el('div', { className: 'choix-ligne' });
    Object.entries(NOMS_SABOTAGES).forEach(([id, [nom]]) => {
      const gratuite = id === 'rumeur' && k.rumeur_gratuite;
      const b = el('button', { type: 'button', className: sab.sabotage === id ? 'actif' : '', disabled: id === 'rumeur' && k.rumeur_utilisee && !gratuite },
        nom + (gratuite ? ' (gratuite)' : ''));
      b.dataset.sabotage = id;
      b.addEventListener('click', () => { Object.assign(sab, { sabotage: id, categorie: null, mode: null, element: null }); rendreDossier(); });
      ligne.appendChild(b);
    });
    c.appendChild(ligne);
    if (sab.sabotage) c.appendChild(el('p', { className: 'legende', style: 'margin-top:8px' }, NOMS_SABOTAGES[sab.sabotage][1] +
      (sab.sabotage === 'interception' ? ' (' + k.interception_minutes + ' min)' : '')));
    const choix = (titre, options, cle) => {
      c.appendChild(el('div', { className: 'etiquette', style: 'margin-top:10px' }, titre));
      const l = el('div', { className: 'choix-ligne' });
      options.forEach((o) => {
        const b = el('button', { type: 'button', className: sab[cle] === o.valeur ? 'actif' : '', disabled: !!o.desactive });
        b.dataset[cle] = o.valeur;
        b.append(o.libelle);
        if (o.petit) b.appendChild(el('small', { className: o.classe || '' }, o.petit));
        b.addEventListener('click', () => { sab[cle] = o.valeur; if (cle === 'categorie') sab.element = null; if (cle === 'cible') sab.categorie = null; rendreDossier(); });
        l.appendChild(b);
      });
      c.appendChild(l);
    };
    let complet = false;
    if (sab.sabotage && sab.sabotage !== 'rumeur') {
      if (sab.cible && !k.cibles.includes(sab.cible)) sab.cible = null;
      choix('Cible', k.cibles.map((n) => ({ valeur: n, libelle: joueurAvecIcone(n),
        petit: sab.sabotage === 'interception' && k.interceptions.includes(n) ? 'déjà guettée' : sab.sabotage === 'fausse_piste' && k.faux_en_attente.includes(n) ? 'un faux l’attend' : '',
        desactive: (sab.sabotage === 'interception' && k.interceptions.includes(n)) })), 'cible');
      complet = !!sab.cible;
      if (sab.sabotage === 'fausse_piste') {
        complet = false;
        if (sab.cible) {
          const risques = k.risques[sab.cible] || {};
          choix('Ce que le faux écarte', ['suspect', 'lieu', 'arme'].map((cat) => ({ valeur: cat, libelle: NOMS_CATEGORIES[cat],
            petit: risques[cat] ? NOMS_RISQUES[risques[cat]] : 'impossible', classe: risques[cat] ? 'risque-' + risques[cat] : '', desactive: !risques[cat] })), 'categorie');
          choix('Livraison', [
            { valeur: 'remplacement', libelle: 'Remplacement', petit: 'son prochain pli', desactive: k.faux_en_attente.includes(sab.cible) },
            { valeur: 'detournement', libelle: 'Détournement', petit: 'le prochain témoin', desactive: !k.detournement_possible }], 'mode');
          complet = !!(sab.categorie && sab.mode);
        }
      }
    } else if (sab.sabotage === 'rumeur') {
      choix('Elle vise', ['suspect', 'lieu', 'arme'].map((cat) => ({ valeur: cat, libelle: NOMS_CATEGORIES[cat] })), 'categorie');
      if (sab.categorie) {
        choix('Quel innocent', (k.innocents[sab.categorie] || []).map((x) => ({ valeur: x,
          libelle: sab.categorie === 'suspect' ? joueurAvecIcone(x) : (trouver(sab.categorie === 'lieu' ? 'lieux' : 'armes', x) || {}).nom || x })), 'element');
      }
      complet = !!(sab.categorie && sab.element);
    }
    const go = el('button', { type: 'button' }, 'Saboter · ' + Math.round(k.detection * 100) + ' % de risque d’être repéré');
    go.dataset.saboter = '1';
    go.dataset.complet = complet ? '1' : '0';
    go.style.marginTop = '12px';
    go.addEventListener('click', () => {
      const m = { type: 'enq_sabotage', sabotage: sab.sabotage };
      if (sab.sabotage !== 'rumeur') m.cible = sab.cible;
      if (sab.sabotage === 'fausse_piste') { m.categorie = sab.categorie; m.mode = sab.mode; }
      if (sab.sabotage === 'rumeur') { m.categorie = sab.categorie; m.element = sab.element; }
      envoyer(m);
      Object.assign(sab, { sabotage: null, cible: null, categorie: null, mode: null, element: null });
    });
    c.appendChild(go);
    c.appendChild(el('p', { className: 'legende', style: 'margin-top:6px' }, 'Repéré, ' + (pack.narrateur ? pack.narrateur.nom : 'le narrateur') +
      ' annonce une « interférence » un peu plus tard, sans dire qui, quoi ni sur qui.'));
    // Historique
    if (k.historique.length) {
      const hst = bloc(contenu, 'Tes sabotages');
      k.historique.slice().reverse().forEach((x) => hst.appendChild(el('p', {}, heure(x.t) + ' · ' + NOMS_SABOTAGES[x.type][0] +
        (x.cible ? ' sur ' + x.cible : '') + (x.element ? ' (' + x.element + ')' : ''))));
    }
    majEtat();
    minuteurDossier = setInterval(majEtat, 1000);
  }

  function regleEvenement(evt) {
    const n = (x) => x.join(' et ');
    return {
      coupure: 'Archive verrouillée et plis illisibles jusqu’au retour du courant.',
      decouverte: 'Un indice vrai vient d’être publié à tous (onglet ' + (pack.narrateur ? pack.narrateur.nom : 'fil') + ').',
      alerte: 'Délai d’accusation divisé par 2, mais une erreur coûte double.',
      brouhaha: 'Les rumeurs fusent deux fois plus vite.',
      interrogatoire: n(evt.interroges || []) + ' doivent livrer à voix haute un indice de leur choix, vrai ou faux, puis taper « J’ai répondu ». Refuser, ou se taire jusqu’au bout : ' + unite(etat.gorgees_refus) + '.',
      maree: 'Chaque victoire rapporte le double de PE.',
    }[evt.type] || '';
  }
  function courantCoupe() { return !!(etat && etat.evenement && etat.evenement.type === 'coupure' && etat.evenement.fin > serveurMaintenant()); }

  // ---------------- Rumeurs : repère sur le plan ----------------
  function signalerLieu(lieu) {
    pings[lieu] = serveurMaintenant() + 20;
    if (manoir && manoir.signaler) manoir.signaler(lieu);
    const z = document.querySelector('.plan .zone[data-lieu="' + lieu + '"]');
    if (z) ajouterPing(z, lieu);
  }
  function ajouterPing(g, lieu) {
    const [x, y, w, h] = pack.plan.zones[lieu];
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', x + w / 2); c.setAttribute('cy', y + h / 2); c.setAttribute('r', Math.min(w, h) / 3); c.setAttribute('class', 'ping');
    g.appendChild(c);
  }

  // ---------------- Enquête en cours ----------------
  let minuteurSec = null;
  function ecranEnquete() {
    titre(pack.nom, 'Enquête en cours');
    // Bandeau : chrono, points, rôle
    elEtat.classList.remove('masque');
    elEtat.textContent = '';
    const chrono = el('span', { className: 'chrono' });
    const pe = el('span', { className: 'pe' });
    if (moi.inscrit) {
      pe.append(el('b', {}, moi.pe + ' PE')); pe.append(' · échecs ' + etat.echecs + '/' + etat.seuil_patience);
      if (moi.handicap_jusqua && moi.handicap_jusqua > serveurMaintenant()) {
        const h = el('span', { className: 'handicap' });
        h.dataset.handicap = moi.handicap_jusqua;
        pe.append(' · ', h);
      }
    }
    elEtat.append(chrono, pe);
    if (moi.inscrit) {
      const r = el('button', { type: 'button', className: 'discret bouton-role' }, '🎭 Rôle');
      r.title = 'Maintiens appuyé';
      brancherRole(r);
      elEtat.appendChild(r);
    }
    // Événement d'ambiance en cours : bandeau, règle active, effet sur le plan
    const evt = etat.evenement;
    ['coupure', 'alerte'].forEach((t) => document.body.classList.toggle('evt-' + t, !!evt && evt.type === t));
    if (evt) {
      const bande = el('div', { className: 'evenement-bande ' + evt.type });
      const txt = el('div', { className: 'txt' });
      const nomE = (pack.evenements && pack.evenements[evt.type] && pack.evenements[evt.type].nom) || evt.type;
      txt.append(el('b', {}, nomE), regleEvenement(evt));
      const reste = el('span', { className: 'reste' });
      reste.dataset.finEvt = evt.fin;
      bande.append(txt, reste);
      if (evt.type === 'interrogatoire') {
        const fait = (n) => (evt.repondu || []).includes(n) ? '✓ a répondu' : (evt.refus || []).includes(n) ? '✗ a refusé' : '⏳';
        const statut = el('div', { className: 'interroges' });
        evt.interroges.forEach((n) => statut.appendChild(el('span', { className: 'interroge' }, joueurAvecIcone(n) + ' ' + fait(n))));
        txt.appendChild(statut);
        if (evt.interroges.includes(monNom) && fait(monNom) === '⏳') {
          const actions = el('div', { className: 'actions-interro' });
          const ok = el('button', { type: 'button' }, 'J’ai répondu ✓');
          ok.dataset.repondu = '1';
          ok.addEventListener('click', () => envoyer({ type: 'enq_repondu' }));
          const r = el('button', { type: 'button', className: 'discret' }, 'Je refuse (' + unite(etat.gorgees_refus) + ')');
          r.addEventListener('click', () => demander('Refuser de livrer un indice ? Tu bois ' + unite(etat.gorgees_refus) + '.', 'Je refuse').then((oui) => { if (oui) envoyer({ type: 'enq_refuser' }); }));
          actions.append(ok, r);
          bande.appendChild(actions);
        }
      }
      elEtat.appendChild(bande);
    }
    // Pénalités à boire, visibles par tous jusqu'à « C'est bu »
    const aBoire = (etat.penalites || []).filter((x) => !x.bu);
    if (aBoire.length) {
      const l = el('div', { className: 'a-boire' });
      aBoire.forEach((x) => {
        const v = el('div', { className: 'verre' + (x.nom === monNom ? ' moi' : '') }, '🍺 ' + x.nom + ' · ' + unite(x.nombre));
        v.title = x.raison;
        if (x.nom === monNom) {
          const b = el('button', { type: 'button' }, 'C’est bu ✓');
          b.dataset.bu = x.id;
          b.addEventListener('click', () => envoyer({ type: 'enq_bu', id: x.id }));
          v.appendChild(b);
        }
        l.appendChild(v);
      });
      elEtat.appendChild(l);
    }
    const nonLus = (moi.archive || []).filter((e) => !e.lu).length;
    const o = onglets('enquete', [
      { id: 'plan', ico: '🗺️', titre: 'Plan' },
      { id: 'indices', ico: '📜', titre: 'Indices', pastille: nonLus || null },
      { id: 'notes', ico: '📝', titre: 'Notes' },
      { id: 'accuser', ico: '⚖️', titre: 'Accuser' },
      { id: 'fil', ico: pack.narrateur.icone, titre: pack.narrateur.nom },
    ]);
    if (!moi.inscrit && (o === 'indices' || o === 'notes' || o === 'accuser')) {
      carte().appendChild(el('p', {}, 'Tu n’es pas inscrit à cette enquête : tu peux suivre, mais pas jouer.'));
    } else ({ plan: ongletPlan, indices: ongletIndices, notes: ongletNotes, accuser: ongletAccuser, fil: ongletFil }[o])();

    clearInterval(minuteurSec);
    const maj = () => {
      chrono.textContent = mmss(etat.fin_a - serveurMaintenant());
      document.querySelectorAll('[data-fin-evt]').forEach((x) => { x.textContent = mmss(Number(x.dataset.finEvt) - serveurMaintenant()); });
      document.querySelectorAll('[data-handicap]').forEach((x) => { const r = Number(x.dataset.handicap) - serveurMaintenant(); x.textContent = r > 0 ? '⏳ pénalité ' + mmss(r) : ''; });
      const coupe = courantCoupe();
      document.querySelectorAll('[data-relire]').forEach((b) => {
        const reste = (moi.consultation_possible_a || 0) - serveurMaintenant();
        b.disabled = reste > 0 || coupe;
        b.textContent = coupe ? '🕯️ Courant coupé' : reste > 0 ? 'Relire dans ' + mmss(reste) : 'Relire (' + unite(etat.gorgees_consultation) + ')';
      });
      document.querySelectorAll('[data-expertiser]').forEach((b) => {
        const reste = (moi.consultation_possible_a || 0) - serveurMaintenant();
        b.disabled = reste > 0 || coupe;
        b.textContent = coupe ? '🕯️ Courant coupé' : reste > 0 ? 'Expertise dans ' + mmss(reste) : 'Expertiser';
      });
      document.querySelectorAll('[data-ouvrir-pli]').forEach((b) => {
        b.disabled = coupe;
        b.textContent = coupe ? '🕯️ Illisible dans le noir' : 'Ouvrir le pli';
      });
      document.querySelectorAll('[data-accuser]').forEach((b) => {
        const reste = (moi.prochaine_accusation_a || 0) - serveurMaintenant();
        const complet = accusation.lieu && accusation.arme && accusation.suspect;
        b.disabled = reste > 0 || !complet;
        b.textContent = reste > 0 ? 'Attendre ' + mmss(reste) : 'Accuser';
      });
    };
    maj();
    minuteurSec = setInterval(maj, 1000);
  }

  // --- Carnet local (jamais envoyé au serveur) ---
  // Il sert à noter ce qu'on a lu et ce que les autres ont DIT : tout y est
  // modifiable, il ne prouve donc rien. Seule l'archive fait foi.
  function cleCarnet() { return 'shield.carnet.' + s.code + '.' + Math.round(etat.ouverture_fin_a || 0); }
  function lireCarnet() {
    try { return JSON.parse(localStorage.getItem(cleCarnet()) || 'null') || { etats: {}, notes: [] }; }
    catch (e) { return { etats: {}, notes: [] }; }
  }
  function ecrireCarnet(c) { try { localStorage.setItem(cleCarnet(), JSON.stringify(c)); } catch (e) { /* tant pis */ } }
  const ETATS = ['', 'elimine', 'suspect'];
  function basculer(cle) {
    const c = lireCarnet();
    const suivant = ETATS[(ETATS.indexOf(c.etats[cle] || '') + 1) % ETATS.length];
    if (suivant) c.etats[cle] = suivant; else delete c.etats[cle];
    ecrireCarnet(c);
    return suivant;
  }

  // --- Plan SVG : les lieux du pack, cliquables ---
  // mode 'carnet' : un appui change l'état (inconnu, éliminé, suspect) ;
  // mode 'accuser' : un appui choisit le lieu ; mode 'fin' : le lieu du crime s'allume.
  const SVG = 'http://www.w3.org/2000/svg';
  function svg(balise, attrs) {
    const e = document.createElementNS(SVG, balise);
    Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v));
    return e;
  }
  function plan(mode, surChoix) {
    const carnet = lireCarnet();
    const racine = svg('svg', { viewBox: pack.plan.vue, class: 'plan' + (mode === 'accuser' ? ' petit' : ''), role: 'img', 'aria-label': 'Plan : ' + pack.nom });
    const defs = svg('defs');
    const motif = svg('pattern', { id: 'hachures', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
    motif.appendChild(svg('rect', { width: 8, height: 8, fill: 'rgba(0,0,0,0.35)' }));
    motif.appendChild(svg('line', { x1: 0, y1: 0, x2: 0, y2: 8, stroke: 'rgba(243,230,207,0.12)', 'stroke-width': 3 }));
    defs.appendChild(motif);
    racine.appendChild(defs);
    const [vx, vy, vw, vh] = pack.plan.vue.split(' ').map(Number);
    racine.appendChild(svg('rect', { x: vx + 3, y: vy + 3, width: vw - 6, height: vh - 6, rx: 14, class: 'murs' }));
    pack.lieux.forEach((l) => {
      const [x, y, w, h] = pack.plan.zones[l.id];
      const ouvert = etat.lieux.includes(l.id);
      let classe = 'zone';
      if (!ouvert) classe += ' fermee';
      else if (mode === 'fin') { if (etat.fin.solution.lieu === l.id) classe += ' crime'; else classe += ' elimine'; }
      else if (mode === 'accuser') { if (accusation.lieu === l.id) classe += ' choisi'; else if (carnet.etats['lieu:' + l.id]) classe += ' ' + carnet.etats['lieu:' + l.id]; }
      else if (carnet.etats['lieu:' + l.id]) classe += ' ' + carnet.etats['lieu:' + l.id];
      const g = svg('g', { class: classe });
      g.dataset.lieu = l.id;
      if (mode === 'carnet' && pings[l.id] && pings[l.id] > serveurMaintenant()) setTimeout(() => ajouterPing(g, l.id), 0);
      g.appendChild(svg('rect', { x, y, width: w, height: h, rx: 10 }));
      g.appendChild(svg('line', { x1: x + 8, y1: y + 8, x2: x + w - 8, y2: y + h - 8, class: 'barre' }));
      const ico = svg('text', { x: x + w / 2, y: y + h / 2 - 4, class: 'ico' }); ico.textContent = l.icone || '';
      const nom = svg('text', { x: x + w / 2, y: y + h / 2 + 16 }); nom.textContent = ouvert ? l.nom : 'Fermé';
      g.append(ico, nom);
      if (ouvert && mode !== 'fin') {
        g.addEventListener('click', () => {
          if (mode === 'accuser') surChoix(l.id);
          else { const etatZone = basculer('lieu:' + l.id); g.setAttribute('class', 'zone' + (etatZone ? ' ' + etatZone : '')); }
        });
      }
      racine.appendChild(g);
    });
    return racine;
  }
  function jetons(cat, elements, mode, choisi, surChoix) {
    const carnet = lireCarnet();
    const l = el('div', { className: 'jetons' });
    elements.forEach(([id, libelle]) => {
      const cle = cat + ':' + id;
      const b = el('button', { type: 'button', className: mode === 'accuser' && choisi === id ? 'choisi' : (carnet.etats[cle] || '') }, libelle);
      b.dataset[cat] = id;
      b.addEventListener('click', () => {
        if (mode === 'accuser') surChoix(id);
        else b.className = basculer(cle);
      });
      l.appendChild(b);
    });
    return l;
  }
  const listeSuspects = () => etat.joueurs.map((x) => [x.nom, joueurAvecIcone(x.nom)]);
  const listeArmes = () => etat.armes.map((id) => { const a = trouver('armes', id); return [id, (a ? a.icone + ' ' : '') + element('armes', id)]; });

  // --- Maison 3D (écran principal de l'enquête) ---
  // Une seule scène pour toute la partie : elle est rattachée à l'onglet à
  // chaque affichage (le redessin de l'écran ne la recrée pas) et mise en
  // pause dès qu'elle n'est plus visible.
  let manoir = null, manoirConteneur = null, manoirEnCours = null, manoirImpossible = false;
  let vue2D = false;
  try { vue2D = localStorage.getItem('shield.plan2d') === '1'; } catch (e) { /* tant pis */ }
  function preparerManoir() {
    if (manoir) return Promise.resolve(manoir);
    if (manoirEnCours) return manoirEnCours;
    // Les étiquettes 3D sont dessinées une fois : on attend la police de l'univers.
    const police = document.fonts && pack.police ? document.fonts.load('700 40px "' + pack.police + '"').catch(() => null) : Promise.resolve();
    manoirEnCours = Promise.all([import('./commun/manoir3d.js'), police]).then(([mod]) => {
      if (!mod.webglDisponible()) throw new Error('webgl');
      manoir = mod.creerManoir3D(manoirConteneur, pack, {
        surAppui: (id) => { basculer('lieu:' + id); majManoir(); },
      });
      return manoir;
    }).catch(() => { manoirImpossible = true; rendu = ''; afficher(); return null; });
    return manoirEnCours;
  }
  function majManoir() {
    if (!manoir || !etat) return;
    const carnet = lireCarnet();
    const etats = {};
    Object.entries(carnet.etats).forEach(([k, v]) => { if (k.startsWith('lieu:')) etats[k.slice(5)] = v; });
    manoir.majEtats(etats, etat.lieux, null);
    manoir.majPersonnages(etat.joueurs.map((j) => {
      const p = portrait(j.portrait) || {};
      return { nom: j.nom, couleur: p.couleur, icone: p.icone };
    }));
  }
  function arreterManoir() { if (manoir) manoir.arreter(); }
  // L'enquête ouverte par-dessus un jeu : le calque prévient quand il se ferme.
  window.addEventListener('message', (e) => {
    if (e.data === 'enquete:pause') arreterManoir();
    if (e.data === 'enquete:reprise' && manoir && etat && etat.phase === 'enquete' && onglet.enquete === 'plan' && manoirConteneur && manoirConteneur.isConnected) manoir.reprendre();
  });

  function ongletPlan() {
    if (!vue2D && !manoirImpossible) {
      if (!manoirConteneur) manoirConteneur = el('div', { className: 'plan3d' });
      ecran.appendChild(manoirConteneur);
      let b = manoirConteneur.querySelector('.bascule');
      if (!b) {
        b = el('button', { type: 'button', className: 'discret bascule' }, 'Vue 2D');
        b.addEventListener('click', () => { vue2D = true; try { localStorage.setItem('shield.plan2d', '1'); } catch (e) {} arreterManoir(); rendu = ''; afficher(); });
        manoirConteneur.appendChild(b);

      }
      preparerManoir().then((m) => { if (m && manoirConteneur.isConnected) { majManoir(); m.reprendre(); } });
    } else {
      if (!manoirImpossible) {
        const b = el('button', { type: 'button', className: 'discret bascule-plan' }, 'Vue 3D');
        b.addEventListener('click', () => { vue2D = false; try { localStorage.removeItem('shield.plan2d'); } catch (e) {} rendu = ''; afficher(); });
        ecran.appendChild(b);
      }
      ecran.appendChild(plan('carnet'));
    }
    const c = carte();
    c.appendChild(el('div', { className: 'etiquette' }, 'Suspects'));
    c.appendChild(jetons('suspect', listeSuspects(), 'carnet'));
    c.appendChild(el('div', { className: 'etiquette' }, 'Armes'));
    c.appendChild(jetons('arme', listeArmes(), 'carnet'));
    c.appendChild(el('div', { className: 'legende' }, 'Touche un lieu, un suspect ou une arme : éliminé, puis suspect, puis inconnu. Ton carnet reste sur ton téléphone.'));
  }

  // Pas de confirm() natif : il gèle la page, donc le battement de cœur,
  // et le serveur finit par croire que le joueur est parti.
  function demander(texte, oui) {
    return window.Soiree && Soiree.confirmer ? Soiree.confirmer(texte, oui || 'Confirmer', 'Annuler') : Promise.resolve(true);
  }
  // Choix entre plusieurs options, sur papier comme une lettre.
  function choisir(titre, texte, options) {
    return new Promise((resolve) => {
      const voile = el('div', { className: 'voile' });
      const l = el('div', { className: 'lettre' });
      l.setAttribute('role', 'dialog');
      l.appendChild(el('h3', {}, titre));
      l.appendChild(el('p', {}, texte));
      const ligne = el('div', { className: 'choix' });
      const fermer = (v) => { voile.remove(); resolve(v); };
      const annuler = el('button', { type: 'button', className: 'discret' }, 'Annuler');
      annuler.addEventListener('click', () => fermer(null));
      ligne.appendChild(annuler);
      options.forEach((o) => {
        const b = el('button', { type: 'button', disabled: !!o.desactive }, o.libelle);
        b.addEventListener('click', () => fermer(o.valeur));
        ligne.appendChild(b);
      });
      l.appendChild(ligne);
      voile.appendChild(l);
      voile.addEventListener('click', (ev) => { if (ev.target === voile) fermer(null); });
      document.body.appendChild(voile);
    });
  }
  function expertiser(e) {
    const cout = moi.cout_indice;
    choisir('Contre-expertise',
      'Gaspard fait examiner l’indice n°' + e.id + ' : le verdict, « Authentique » ou « Falsifié », restera tamponné dessus. ' +
      'Ça compte comme une consultation (même chrono). Personne d’autre ne saura le résultat.',
      [{ libelle: cout + ' PE', valeur: 'pe', desactive: moi.pe < cout },
       { libelle: unite(etat.gorgees_expertise || 1), valeur: 'gorgee' }])
      .then((paiement) => { if (paiement) envoyer({ type: 'enq_expertise', id: e.id, paiement }); });
  }

  function ongletIndices() {
    const t = carte();
    t.appendChild(el('p', {}, 'Un indice : ' + moi.cout_indice + ' PE · ' + moi.indices_heure + '/' + moi.indices_heure_max + ' cette heure.'));
    const l = el('div', { className: 'ligne' }); l.style.marginTop = '8px';
    const plein = moi.indices_heure >= moi.indices_heure_max || etat.dossier_epuise;
    const dem = el('button', { type: 'button', disabled: plein || moi.pe < moi.cout_indice }, 'Demander un indice');
    dem.addEventListener('click', () => envoyer({ type: 'enq_indice' }));
    const ach = el('button', { type: 'button', className: 'discret', disabled: plein }, 'Acheter (' + unite(etat.gorgees_achat) + ')');
    ach.addEventListener('click', () => demander('Acheter un indice contre ' + unite(etat.gorgees_achat) + ' ?', 'Acheter').then((ok) => { if (ok) envoyer({ type: 'enq_acheter' }); }));
    l.append(dem, ach);
    t.appendChild(l);
    if (etat.dossier_epuise) t.appendChild(el('p', { style: 'margin-top:8px' }, 'Le dossier est épuisé : plus aucun indice à distribuer. Tes PE servent encore aux contre-expertises.'));
    t.appendChild(el('p', { className: 'legende', style: 'margin-top:8px' }, 'De temps en temps, un témoin anonyme glisse un pli à quelqu’un, au hasard.'));

    (moi.archive || []).filter((e) => !e.lu).forEach((e) => {
      const c = carte('📜 Un pli pour toi');
      c.classList.add('pli');
      c.appendChild(el('p', {}, e.source + ' · reçu à ' + heure(e.recu_a) + '. Lecture libre une fois ; ensuite il ira dans ton archive.'));
      const b = el('button', { type: 'button' }, 'Ouvrir le pli');
      b.dataset.ouvrirPli = '1';
      b.style.marginTop = '8px';
      b.addEventListener('click', () => envoyer({ type: 'enq_lire', id: e.id }));
      c.appendChild(b);
    });

    const lus = (moi.archive || []).filter((e) => e.lu);
    const a = carte('Ton archive');
    if (!lus.length) {
      a.appendChild(el('p', {}, 'Aucun indice rangé. Relire un indice demande d’attendre ' + Math.round(etat.timer_consultation / 60) +
        ' min depuis la dernière consultation, et coûte ' + unite(etat.gorgees_consultation) + '.'));
      return;
    }
    a.appendChild(el('p', { style: 'margin-bottom:4px' }, 'Seule preuve possible : montre ton écran en relisant. Même prix devant les autres.'));
    lus.slice().reverse().forEach((e) => {
      const ligne = el('div', { className: 'archive-ligne' });
      const txt = el('div', { className: 'txt' }, 'Indice n°' + e.id);
      if (e.tampon) txt.appendChild(el('span', { className: 'tampon ' + e.tampon }, e.tampon === 'authentique' ? 'Authentique' : 'Falsifié'));
      txt.appendChild(el('span', {}, e.source + ' · ' + heure(e.recu_a)));
      const actions = el('div', { className: 'actions' });
      const b = el('button', { type: 'button', className: 'discret' });
      b.dataset.relire = '1';
      b.addEventListener('click', () => {
        demander('Relire cet indice ? Ça coûte ' + unite(etat.gorgees_consultation) + ' et relance le chrono.', 'Relire')
          .then((ok) => { if (ok) envoyer({ type: 'enq_consulter', id: e.id }); });
      });
      actions.appendChild(b);
      if (!e.tampon) {
        const x = el('button', { type: 'button', className: 'discret' }, 'Expertiser');
        x.dataset.expertiser = '1';
        x.addEventListener('click', () => expertiser(e));
        actions.appendChild(x);
      }
      ligne.append(txt, actions);
      a.appendChild(ligne);
    });
  }

  function ongletNotes() {
    const carnet = lireCarnet();
    const c = carte();
    c.appendChild(el('p', {}, 'Ce que tu as lu, ce qu’on t’a dit. Ton carnet reste sur ton téléphone ; il ne prouve rien.'));
    const zone = el('textarea', { id: 'note-texte', placeholder: 'Ta note…', maxLength: 300 });
    zone.style.marginTop = '8px';
    c.appendChild(zone);
    const l = el('div', { className: 'ligne' }); l.style.marginTop = '8px';
    const source = el('input', { type: 'text', id: 'note-source', placeholder: 'dit par… (facultatif)', maxLength: 20 });
    source.style.flex = '1 1 140px';
    const ajouter = el('button', { type: 'button', className: 'discret' }, 'Noter');
    ajouter.addEventListener('click', () => {
      const texte = zone.value.trim();
      if (!texte) return;
      const c2 = lireCarnet();
      c2.notes.unshift({ texte, source: source.value.trim(), t: Date.now() });
      ecrireCarnet(c2);
      zone.value = ''; source.value = '';
      document.activeElement && document.activeElement.blur();
      rendu = ''; afficher();
    });
    l.append(source, ajouter);
    c.appendChild(l);
    const liste = el('div', { className: 'notes-carnet' });
    carnet.notes.forEach((n, i) => {
      const d = el('div');
      const t = el('span', {}, n.texte);
      if (n.source) { t.appendChild(document.createElement('br')); t.appendChild(el('em', {}, 'dit par ' + n.source)); }
      const x = el('button', { type: 'button', className: 'discret' }, '✕');
      x.addEventListener('click', () => { const c2 = lireCarnet(); c2.notes.splice(i, 1); ecrireCarnet(c2); rendu = ''; afficher(); });
      d.append(t, x);
      liste.appendChild(d);
    });
    c.appendChild(liste);
  }

  // --- Accusation : on touche le lieu sur le plan, puis l'arme et le personnage ---
  function ongletAccuser() {
    const choisir = (cle) => (id) => { accusation[cle] = accusation[cle] === id ? null : id; rendu = ''; afficher(); };
    ecran.appendChild(plan('accuser', choisir('lieu')));
    const c = carte();
    c.appendChild(el('div', { className: 'etiquette' }, 'Avec quelle arme ?'));
    c.appendChild(jetons('arme', listeArmes(), 'accuser', accusation.arme, choisir('arme')));
    c.appendChild(el('div', { className: 'etiquette' }, 'Qui ?'));
    c.appendChild(jetons('suspect', listeSuspects(), 'accuser', accusation.suspect, choisir('suspect')));
    const complet = accusation.lieu && accusation.arme && accusation.suspect;
    c.appendChild(el('p', { style: 'margin-top:8px' }, 'On apprend combien d’éléments sont justes, pas lesquels. ' +
      'Échecs cumulés : ' + etat.echecs + '/' + etat.seuil_patience + ' ; au-delà, ' + pack.vocabulaire.tueur + ' gagne.'));
    const barre = el('div', { className: 'barre-accuser' });
    barre.appendChild(el('div', { className: 'resume' }, complet
      ? accusation.suspect + ', ' + elementLe('lieux', accusation.lieu) + ', ' + elementLe('armes', accusation.arme) + '.'
      : 'Touche un lieu, une arme, un personnage.'));
    const b = el('button', { type: 'button' }, 'Accuser');
    b.dataset.accuser = '1';
    b.addEventListener('click', async () => {
      if (!complet) return;
      const choix = { suspect: accusation.suspect, arme: accusation.arme, lieu: accusation.lieu };
      const ok = await demander('Accuser ' + choix.suspect + ' ? Si tu te trompes : ' + unite(prochainesGorgees()) + ' et un délai doublé.', 'Accuser');
      if (!ok) return;
      envoyer({ type: 'enq_accuser', ...choix });
    });
    barre.appendChild(b);
    if ((moi.accusations || []).length) {
      const h = carte('Tes accusations');
      moi.accusations.slice().reverse().forEach((x) => {
        h.appendChild(el('p', {}, heure(x.t) + ' · ' + x.suspect + ', ' + element('lieux', x.lieu) + ', ' + element('armes', x.arme) +
          ' : ' + x.justes + ' juste' + (x.justes > 1 ? 's' : '') + ' sur 3'));
      });
    }
    ecran.appendChild(barre);
  }
  function prochainesGorgees() {
    const echecs = (moi.accusations || []).filter((x) => x.justes < 3).length;
    return [2, 4, 6][Math.min(echecs, 2)];
  }

  function ongletFil() {
    const c = carte();
    c.classList.add('fil');
    const j = (etat.journal || []).map((x) => Object.assign({ rumeur: false }, x))
      .concat((etat.rumeurs || []).map((x) => Object.assign({ rumeur: true }, x)))
      .concat((etat.penalites || []).map((x) => ({ t: x.t, texte: '🍺 ' + x.nom + ' boit ' + unite(x.nombre) + ' (' + x.raison.toLowerCase() + ')' + (x.bu ? ' ✓' : ' ⏳') })))
      .sort((a, b) => b.t - a.t);
    if (!j.length) c.appendChild(el('p', {}, 'Rien à signaler pour l’instant.'));
    j.forEach((x) => {
      const p = el('p', { className: x.rumeur ? 'rumeur' : '' });
      p.append(el('small', {}, heure(x.t)), (x.rumeur ? '🗣️ ' + majusculeInit(pack.vocabulaire.rumeurs || 'rumeur') + ' : ' : '') + x.texte);
      c.appendChild(p);
    });
  }

  // ---------------- Fin ----------------
  function ecranFin() {
    clearInterval(minuteurSec);
    titre(pack.nom, 'Enquête close');
    const f = etat.fin;
    const o = onglets('fin', [{ id: 'recit', ico: '📖', titre: 'Dénouement' }, { id: 'recap', ico: '📋', titre: 'Récapitulatif' }]);
    if (o === 'recit') {
      ecran.appendChild(plan('fin'));
      const majuscule = (t) => t.charAt(0).toUpperCase() + t.slice(1);
      const c = carte(majuscule(f.vainqueur === 'tueur' ? pack.vocabulaire.tueur + ' l’emporte' : pack.vocabulaire.detective + ' : ' + f.detective));
      const arme = trouver('armes', f.solution.arme);
      c.appendChild(el('p', { className: 'resume' }, joueurAvecIcone(f.solution.tueur) + ' · ' + (arme ? arme.icone + ' ' : '') +
        element('armes', f.solution.arme) + ' · ' + element('lieux', f.solution.lieu)));
      c.appendChild(el('p', { className: 'recit' }, f.recit));
      (f.recap.gorgees || []).forEach((g) => c.appendChild(el('p', { style: 'margin-top:8px;color:var(--texte)' }, '🍺 ' + g.qui + ' ' + g.action + ' ' + unite(g.nombre) + '.')));
    } else {

          t.appendChild(tr);
        });
        a.appendChild(t);
      }
      const i = carte('Indices reçus');

      (f.recap.bues || []).slice().sort((a, b) => b.total - a.total).forEach((x) => {
        const tr = el('tr');
        tr.append(el('td', {}, joueurAvecIcone(x.nom)), el('td', {}, String(x.total)), el('td', {}, String(x.handicap)));
        tg.appendChild(tr);
      });
      gb.appendChild(tg);

      liste.forEach((x) => sb.appendChild(el('p', {}, NOMS_SABOTAGES[x.type][0] + (x.cible ? ' sur ' + x.cible : '') +
        ' · ' + (x.detecte ? 'repéré' : 'passé inaperçu'))));
    }
  }

  // ---------------- Lettre, verdict et alertes ----------------
  // L'illustration d'un indice : la « photo » de l'élément écarté (portrait,
  // pièce ou arme) et, pour une pièce, sa place sur le plan. Même gabarit
  // pour tous les indices, vrais ou faux.
  function vignetteIndice(msg) {
    if (!msg.categorie || !pack) return null;
    let icone = '❔', nom = msg.element, fond = '#3a2418', rubrique = '';
    if (msg.categorie === 'suspect') {
      const j = (etat ? etat.joueurs : []).find((x) => x.nom === msg.element);
      const p = j && portrait(j.portrait);
      icone = p ? p.icone : '👤'; fond = p ? p.couleur : fond;
      const qui = majusculeInit((pack.vocabulaire && pack.vocabulaire.enqueteur) || 'suspect');
      rubrique = p ? qui + ' · ' + p.archetype : qui;
    } else {
      const cle = msg.categorie === 'lieu' ? 'lieux' : 'armes';
      const e = trouver(cle, msg.element);
      icone = e && e.icone ? e.icone : (cle === 'lieux' ? '🚪' : '🔍');
      nom = e ? e.nom : msg.element;
      fond = cle === 'lieux' ? ((pack.plan && pack.plan.murs && pack.plan.murs[msg.element]) || fond) : '#2a1216';
      rubrique = cle === 'lieux' ? 'Lieu' : 'Pièce à conviction';
    }
    const v = el('div', { className: 'vignette' });
    const photo = el('div', { className: 'photo' });
    const image = el('div', { className: 'image' }, icone);
    image.style.setProperty('--fond-photo', fond);
    photo.append(el('div', { className: 'punaise' }), image, el('div', { className: 'bande' }, 'HORS DE CAUSE'), el('div', { className: 'legende-photo' }, (msg.id ? 'Scellé n°' + msg.id : msg.decouverte ? 'Découverte' : 'Copie')));
    const dossier = el('div', { className: 'dossier' });
    dossier.append(el('span', {}, rubrique), el('b', {}, msg.categorie === 'suspect' ? nom : elementLe(msg.categorie === 'lieu' ? 'lieux' : 'armes', msg.element)));
    if (msg.categorie === 'lieu' && pack.plan && pack.plan.zones) dossier.appendChild(miniPlan(msg.element));
    else dossier.appendChild(el('span', {}, msg.categorie === 'suspect' ? 'Innocenté par ' + (pack.narrateur ? pack.narrateur.nom : 'le narrateur') : 'Écarté du dossier'));
    v.append(photo, dossier);
    return v;
  }
  function miniPlan(cible) {
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', pack.plan.vue || '0 0 400 400');
    svg.setAttribute('class', 'mini');
    const zones = Object.assign({}, pack.plan.couloirs || {}, pack.plan.zones);
    Object.entries(zones).forEach(([id, [x, y, w, h]]) => {
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', x + 2); r.setAttribute('y', y + 2); r.setAttribute('width', w - 4); r.setAttribute('height', h - 4);
      r.setAttribute('fill', id === cible ? '#a3161b' : 'rgba(58,42,28,0.12)');
      r.setAttribute('stroke', '#3a2a1c'); r.setAttribute('stroke-width', '3');
      svg.appendChild(r);
    });
    return svg;
  }

  function montrerLettre(msg) {
    const voile = el('div', { className: 'voile' });
    const l = el('div', { className: 'lettre' });
    if (msg.ecoute) l.appendChild(el('h3', {}, '👂 Écoute : le dernier pli de ' + msg.cible));
    const vig = vignetteIndice(msg);
    if (vig) l.appendChild(vig);
    l.appendChild(el('div', { className: 'corps' }, msg.texte));
    l.appendChild(el('div', { className: 'meta' }, msg.source + ' · reçu à ' + heure(msg.recu_a) +
      (msg.tampon ? ' · ' + (msg.tampon === 'authentique' ? 'Authentique' : 'Falsifié') : '')));
    l.appendChild(el('div', { className: 'avis' }, msg.gratuit
      ? 'Lecture libre, une seule fois. Pour le relire plus tard, il faudra attendre le chrono et payer en ' + (etat ? etat.unite : 'gorgée') + 's.'
      : msg.decouverte ? 'Indice public : tout le monde l’a reçu en même temps.'
      : msg.ecoute ? 'Il ne sait pas que tu l’as lu. Ce pli n’entre pas dans ton archive.'
      : msg.expertise ? 'Contre-expertise : le tampon reste sur cet indice. À toi de voir ce que tu en dis.' : 'Relecture de l’archive.'));
    if (msg.expertise && msg.tampon) l.appendChild(el('div', { className: 'cachet ' + msg.tampon }, msg.tampon === 'authentique' ? 'AUTHENTIQUE' : 'FALSIFIÉ'));
    const b = el('button', { type: 'button' }, msg.gratuit && !msg.ecoute && !msg.decouverte ? 'Ranger dans l’archive' : 'Fermer');
    b.addEventListener('click', () => voile.remove());
    l.appendChild(b);
    voile.appendChild(l);
    document.body.appendChild(voile);
  }
  function montrerVerdict(msg) {
    accusation.lieu = accusation.arme = accusation.suspect = null;
    const voile = el('div', { className: 'voile' });
    const l = el('div', { className: 'lettre' });
    l.appendChild(el('div', { className: 'corps' }, msg.justes + ' élément' + (msg.justes > 1 ? 's' : '') + ' juste' + (msg.justes > 1 ? 's' : '') + ' sur 3.'));
    l.appendChild(el('div', { className: 'meta' }, msg.suspect + ', ' + element('lieux', msg.lieu) + ', ' + element('armes', msg.arme) + '.'));
    l.appendChild(el('div', { className: 'avis' }, 'Lesquels ? À toi de le déduire. Prochaine accusation à ' + heure(msg.prochaine_a) + '.'));
    const b = el('button', { type: 'button' }, 'Compris');
    b.addEventListener('click', () => voile.remove());
    l.appendChild(b);
    voile.appendChild(l);
    document.body.appendChild(voile);
  }
  let minuteurToast = null;
  function toast(texte, genre, duree) {
    let t = document.getElementById('toast');
    if (!t) { t = el('div', { id: 'toast', className: 'toast' }); t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.className = 'toast ' + (genre || '');
    t.textContent = texte;
    t.style.display = 'block';
    clearTimeout(minuteurToast);
    minuteurToast = setTimeout(() => { t.style.display = 'none'; }, duree || 4000);
  }

  seConnecter();
})();
</script>
</body>
</html>
