<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Enquête</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<meta name="theme-color" content="#1a0b0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Les couleurs viennent du pack de l'univers (palette) ; valeurs du Manoir par défaut. */
  :root {
    --fond: #1a0b0e;
    --surface: #2a1216;
    --accent: #c9a24a;
    --texte: #f3e6cf;
    --alerte: #b3261e;
    --doux: rgba(243, 230, 207, 0.66);
    --bord: rgba(201, 162, 74, 0.28);
    --titre: 'Cormorant Garamond', Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--fond); height: 100%; }
  /* Une seule page, sans défilement : bandeau en haut, contenu, onglets en bas. */
  body {
    color: var(--texte); font: 400 16px/1.45 'Outfit', system-ui, sans-serif;
    height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(201, 162, 74, 0.16), transparent 60%),
      radial-gradient(80% 50% at 100% 100%, rgba(179, 38, 30, 0.12), transparent 60%),
      var(--fond);
  }
  header {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) 14px 8px; max-width: 620px; width: 100%; margin: 0 auto;
  }
  header .retour { color: var(--doux); text-decoration: none; font-size: 0.85rem; border: 1px solid var(--bord); border-radius: 999px; padding: 5px 11px; white-space: nowrap; }
  header h1 { font: 700 1.35rem/1.05 var(--titre); flex: 1; min-width: 0; }
  header h1 small { display: block; font: 500 0.7rem 'Outfit', sans-serif; color: var(--doux); letter-spacing: 0.05em; text-transform: uppercase; }
  .etat-jeu {
    flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px 8px; max-width: 620px; width: 100%; margin: 0 auto;
  }
  .etat-jeu .chrono { font: 700 1.5rem/1 var(--titre); color: var(--accent); }
  .etat-jeu .pe { color: var(--doux); font-size: 0.9rem; flex: 1; }
  .etat-jeu .pe b { color: var(--texte); }
  .etat-jeu button { padding: 8px 12px; font-size: 0.85rem; }
  main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 14px 12px; max-width: 620px; width: 100%; margin: 0 auto; }
  nav.onglets {
    flex: none; display: flex; border-top: 1px solid var(--bord); background: rgba(10, 4, 6, 0.85);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.onglets button {
    flex: 1; background: none; border: 0; border-radius: 0; color: var(--doux); padding: 8px 2px 9px;
    display: grid; justify-items: center; gap: 1px; font: 600 0.7rem 'Outfit', sans-serif; position: relative;
  }
  nav.onglets button .ico { font-size: 1.25rem; line-height: 1.2; }
  nav.onglets button.actif { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
  nav.onglets .pastille { position: absolute; top: 4px; right: calc(50% - 22px); min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px;
    background: var(--alerte); color: #fff; font-size: 0.68rem; line-height: 17px; }

  .carte { background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--bord); border-radius: 18px; padding: 14px; margin-bottom: 10px; }
  .carte h2 { font: 700 1.25rem/1.2 var(--titre); margin-bottom: 6px; color: var(--accent); }
  .carte p { color: var(--doux); font-size: 0.93rem; }
  .carte p + p { margin-top: 6px; }
  .ligne { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ligne + .ligne { margin-top: 8px; }
  button, .bouton {
    border: 0; border-radius: 14px; padding: 11px 15px; cursor: pointer; text-decoration: none; display: inline-block;
    background: var(--accent); color: #1a0f05; font: 600 0.92rem 'Outfit', sans-serif; transition: transform 0.12s ease;
  }
  button:active { transform: scale(0.97); }
  button.discret { background: rgba(243, 230, 207, 0.08); color: var(--texte); border: 1px solid var(--bord); }
  button.puce { padding: 7px 11px; border-radius: 999px; font-size: 0.83rem; }
  button.puce.choisie { background: var(--accent); color: #1a0f05; border-color: transparent; }
  button:disabled { opacity: 0.45; cursor: default; transform: none; }
  input[type=text], select, textarea {
    border-radius: 12px; border: 1px solid var(--bord); background: rgba(0, 0, 0, 0.3); color: var(--texte);
    padding: 9px 11px; font: 500 0.93rem 'Outfit', sans-serif; min-width: 0;
  }
  textarea { width: 100%; min-height: 70px; resize: vertical; }
  label.case { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; padding: 5px 9px; border: 1px solid var(--bord); border-radius: 999px; }
  .etiquette { color: var(--doux); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 10px 0 5px; }
  .etiquette:first-child { margin-top: 0; }
  .erreur { position: fixed; left: 14px; right: 14px; top: max(54px, calc(env(safe-area-inset-top) + 44px)); z-index: 40; max-width: 560px; margin: 0 auto;
    background: #4a1410; border: 1px solid #ff6b5e; color: #ffd9d3; border-radius: 12px; padding: 9px 12px; font-size: 0.88rem; }
  .erreur:empty { display: none; }

  /* Portraits */
  .portraits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .portrait { border-radius: 14px; padding: 8px 3px 6px; text-align: center; cursor: pointer; background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--bord); color: var(--texte); font: inherit; display: grid; justify-items: center; gap: 2px; }
  .portrait .visage { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 1.25rem;
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.12), 0 4px 12px rgba(0, 0, 0, 0.35); }
  .portrait .arch { font: 600 0.82rem/1.05 var(--titre); }
  .portrait .qui { font-size: 0.68rem; color: var(--doux); min-height: 1em; }
  .portrait.pris { opacity: 0.5; cursor: default; }
  .portrait.moi { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; opacity: 1; }
  .joueurs { display: flex; flex-wrap: wrap; gap: 6px; }
  .joueurs span { background: rgba(243, 230, 207, 0.08); border-radius: 999px; padding: 5px 10px; font-size: 0.85rem; }

  /* Ouverture */
  .narration p { font: 500 1.28rem/1.33 var(--titre); color: var(--texte); opacity: 0; transform: translateY(6px); transition: opacity 0.9s ease, transform 0.9s ease; }
  .narration p.vue { opacity: 1; transform: none; }
  .narration p + p { margin-top: 12px; }
  .narrateur { display: flex; align-items: center; gap: 10px; color: var(--accent); font: 700 1.05rem var(--titre); margin-bottom: 10px; }
  .narrateur span { font-size: 1.5rem; }
  .eclair { position: fixed; inset: 0; pointer-events: none; background: #fff; opacity: 0; z-index: 70; }
  .eclair.flash { animation: eclair 1.6s ease-out; }
  @keyframes eclair { 0% { opacity: 0; } 4% { opacity: 0.55; } 8% { opacity: 0.05; } 12% { opacity: 0.35; } 100% { opacity: 0; } }

  /* Rôle : appui long */
  .bouton-role { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  .zone-role { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; border-radius: 18px; padding: 18px 14px; text-align: center; cursor: pointer;
    background: repeating-linear-gradient(45deg, rgba(201, 162, 74, 0.08) 0 12px, rgba(201, 162, 74, 0.02) 12px 24px); border: 1px dashed var(--bord); color: var(--doux); }
  .role-voile { position: fixed; inset: 0; z-index: 80; background: rgba(10, 4, 6, 0.96); display: none; place-items: center; padding: 24px; text-align: center; pointer-events: none; }
  .role-voile.ouvert { display: grid; }
  .role-voile .titre-role { font: 700 2rem/1.1 var(--titre); color: var(--accent); margin-bottom: 10px; }
  .role-voile.tueur .titre-role { color: #ff6b5e; }
  .role-voile p { color: var(--texte); font-size: 1.05rem; max-width: 420px; }
  .role-voile p + p { margin-top: 8px; }

  /* Plan */
  .plan { width: 100%; max-height: 46dvh; display: block; margin: 0 auto 6px; touch-action: manipulation; }
  .plan .zone rect { fill: rgba(243, 230, 207, 0.06); stroke: var(--bord); stroke-width: 1.5; transition: fill 0.25s ease; }
  .plan .zone { cursor: pointer; }
  .plan .zone text { fill: var(--texte); font: 600 13px 'Cormorant Garamond', serif; text-anchor: middle; pointer-events: none; }
  .plan .zone .ico { font-size: 18px; }
  .plan .zone.elimine rect { fill: rgba(0, 0, 0, 0.4); }
  .plan .zone.elimine text { opacity: 0.4; }
  .plan .zone .barre { stroke: rgba(243, 230, 207, 0.35); stroke-width: 1.5; display: none; pointer-events: none; }
  .plan .zone.elimine .barre { display: inline; }
  .plan .zone.suspect rect { fill: rgba(179, 38, 30, 0.35); stroke: #ff6b5e; }
  .plan .zone.choisi rect { fill: rgba(201, 162, 74, 0.35); stroke: var(--accent); stroke-width: 3; }
  .plan .zone.fermee { cursor: default; }
  .plan .zone.fermee rect { fill: url(#hachures); stroke: rgba(243, 230, 207, 0.1); }
  .plan .zone.fermee text { opacity: 0.35; }
  .plan .zone.crime rect { fill: rgba(179, 38, 30, 0.55); stroke: #ff6b5e; stroke-width: 3; animation: crime 1.6s ease-in-out infinite; }
  @keyframes crime { 50% { fill: rgba(179, 38, 30, 0.25); } }
  .plan .murs { fill: none; stroke: rgba(201, 162, 74, 0.45); stroke-width: 3; }
  .jetons { display: flex; flex-wrap: wrap; gap: 5px; }
  .jetons button { padding: 5px 9px; border-radius: 10px; font-size: 0.82rem; background: rgba(243, 230, 207, 0.06); color: var(--texte); border: 1px solid var(--bord); }
  .jetons button.elimine { text-decoration: line-through; opacity: 0.45; }
  .jetons button.suspect { border-color: #ff6b5e; color: #ffb4a8; background: rgba(179, 38, 30, 0.2); }
  .jetons button.choisi { border-color: var(--accent); background: rgba(201, 162, 74, 0.3); color: var(--texte); }
  .legende { color: var(--doux); font-size: 0.75rem; margin-top: 6px; }
  /* Maison 3D : la scène prend le haut de l'onglet Plan */
  .plan3d { position: relative; height: 46dvh; min-height: 230px; border-radius: 18px; overflow: hidden; border: 1px solid var(--bord); margin-bottom: 8px; touch-action: none; background: var(--fond); }
  .plan3d canvas { width: 100%; height: 100%; display: block; }
  .plan3d .bascule { position: absolute; top: 8px; right: 8px; padding: 6px 10px; font-size: 0.78rem; border-radius: 999px; }
  .plan3d .aide3d { position: absolute; left: 10px; bottom: 8px; right: 10px; font-size: 0.72rem; color: var(--doux); pointer-events: none; text-shadow: 0 1px 3px #000; }
  .bascule-plan { display: block; margin: -2px 0 8px auto; padding: 6px 10px; font-size: 0.78rem; border-radius: 999px; }
  /* Accuser : plan réduit, et le résumé avec son bouton toujours visibles en bas */
  .plan.petit { max-height: 27dvh; }
  .barre-accuser { position: sticky; bottom: -12px; margin: 0 -14px -12px; padding: 8px 14px 12px; display: flex; align-items: center; gap: 10px;
    background: linear-gradient(transparent, var(--fond) 18%); }
  .barre-accuser .resume { flex: 1; margin: 0; font-size: 1rem; }
  .barre-accuser button { flex: none; }

  /* Indices, archive, notes, fil */
  .pli { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .archive-ligne { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--bord); }
  .archive-ligne:first-of-type { border-top: 0; }
  .archive-ligne .txt { flex: 1; min-width: 0; font-size: 0.9rem; }
  .archive-ligne .txt span { display: block; color: var(--doux); font-size: 0.78rem; }
  .archive-ligne button { padding: 7px 11px; font-size: 0.82rem; white-space: nowrap; }
  .tampon { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 6px; font-size: 0.72rem; border: 1px solid currentColor; }
  .notes-carnet { display: grid; gap: 6px; margin-top: 8px; }
  .notes-carnet div { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9rem; background: rgba(0, 0, 0, 0.2); border-radius: 10px; padding: 8px 10px; }
  .notes-carnet div span { flex: 1; overflow-wrap: anywhere; }
  .notes-carnet div em { color: var(--doux); font-style: normal; font-size: 0.8rem; }
  .notes-carnet button { padding: 2px 8px; font-size: 0.8rem; }
  .fil p { font-size: 0.9rem; padding: 6px 0; border-top: 1px solid var(--bord); color: var(--texte); }
  .fil p:first-of-type { border-top: 0; }
  .fil p small { color: var(--doux); margin-right: 6px; }
  .resume { font: 600 1.1rem/1.3 var(--titre); color: var(--texte); margin: 8px 0; }
  .recit { font: 500 1.22rem/1.38 var(--titre); color: var(--texte); }
  table.recap { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.recap td, table.recap th { padding: 6px 4px; border-top: 1px solid var(--bord); text-align: left; vertical-align: top; }
  table.recap th { color: var(--doux); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; }

  /* Lettre et alertes */
  .voile { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.72); display: grid; place-items: center; padding: 20px; }
  .lettre { max-width: 460px; width: 100%; background: #f1e3c4; color: #2a1a10; border-radius: 6px; padding: 24px 20px 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
  .lettre .corps { font: 600 1.4rem/1.35 var(--titre); }
  .lettre .meta { margin-top: 12px; font-size: 0.82rem; color: #6b5440; }
  .lettre .avis { margin-top: 8px; font-size: 0.85rem; color: #6b5440; }
  .lettre button { margin-top: 14px; background: #2a1a10; color: #f1e3c4; }
  .toast { position: fixed; left: 14px; right: 14px; bottom: calc(66px + env(safe-area-inset-bottom)); z-index: 60; max-width: 520px; margin: 0 auto;
    background: #2a1216; border: 1px solid var(--accent); border-radius: 14px; padding: 12px 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
  .toast.gorgee { background: #4a1410; border-color: #ff6b5e; font-size: 1.05rem; }
  .masque { display: none !important; }
</style>
</head>
<body>
<div class="eclair" id="eclair"></div>
<header>
  <a class="retour" id="retour" href="index.html">← Soirée</a>
  <h1 id="titre"><small>Enquête</small>Chargement…</h1>
</header>
<div class="etat-jeu masque" id="etat-jeu"></div>
<main id="ecran"></main>
<nav class="onglets masque" id="onglets"></nav>
<div class="erreur" id="erreur" role="alert"></div>
<div class="role-voile" id="role-voile" aria-live="polite"></div>

<script src="commun/soiree.js"></script>
<script>
// Enquête : jeu fil conducteur de la soirée. Tout tient sur un écran : un
// bandeau en haut, le contenu de l'onglet choisi, la barre d'onglets en bas.
// La page parle au serveur par la connexion « soirée » (/ws-soiree),
// distincte de la place à une table : on l'ouvre par-dessus un jeu sans
// quitter sa partie.
(function () {
  const dansJeu = new URLSearchParams(location.search).get('dans') === '1';
  if (dansJeu) document.getElementById('retour').classList.add('masque');

  const ecran = document.getElementById('ecran');
  const elErreur = document.getElementById('erreur');
  const elTitre = document.getElementById('titre');
  const elEtat = document.getElementById('etat-jeu');
  const elOnglets = document.getElementById('onglets');
  const elRole = document.getElementById('role-voile');

  const s = Soiree.actuelle();
  let monNom = Soiree.nom();
  let pack = null, etat = null, moi = null, couches = [];
  let ws = null, tentatives = 0, minuteur = null, dernierSignal = 0;
  let ouvertureLancee = false;
  // Onglet choisi par phase (gardé à travers les mises à jour).
  const onglet = { lobby: 'perso', enquete: 'plan', fin: 'recit' };
  // Accusation en préparation (lieu, arme, personnage).
  const accusation = { lieu: null, arme: null, suspect: null };

  function el(balise, attrs, texte) {
    const e = document.createElement(balise);
    Object.assign(e, attrs || {});
    if (texte != null) e.textContent = texte;
    return e;
  }
  function carte(titre, parent) {
    const c = el('section', { className: 'carte' });
    if (titre) c.appendChild(el('h2', {}, titre));
    (parent || ecran).appendChild(c);
    return c;
  }
  function envoyer(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }
  function titre(principal, sous) {
    elTitre.textContent = '';
    elTitre.appendChild(el('small', {}, sous || 'Enquête'));
    elTitre.append(principal);
  }
  function erreur(texte) {
    elErreur.textContent = texte;
    setTimeout(() => { if (elErreur.textContent === texte) elErreur.textContent = ''; }, 5000);
  }
  function appliquerPalette(p) {
    const r = document.documentElement.style;
    ['fond', 'surface', 'accent', 'texte', 'alerte'].forEach((k) => { if (p[k]) r.setProperty('--' + k, p[k]); });
  }
  function portrait(id) { return pack && pack.portraits.find((p) => p.id === id); }
  function trouver(cle, id) { return pack && pack[cle].find((x) => x.id === id); }
  function element(cle, id) { const e = trouver(cle, id); return e ? e.nom : id; }
  function elementLe(cle, id) { const e = trouver(cle, id); return e ? (e.le || e.nom) : id; }
  function joueurAvecIcone(nom) {
    const j = etat.joueurs.find((x) => x.nom === nom);
    const p = j && portrait(j.portrait);
    return (p ? p.icone + ' ' : '') + nom;
  }
  function duree(sec) {
    const h = Math.floor(sec / 3600), mn = Math.round((sec % 3600) / 60);
    return h ? h + ' h' + (mn ? ' ' + String(mn).padStart(2, '0') : '') : mn + ' min';
  }
  function heure(t) {
    const d = new Date(t * 1000);
    return String(d.getHours()).padStart(2, '0') + 'h' + String(d.getMinutes()).padStart(2, '0');
  }
  function mmss(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
  }
  function unite(n) { return n + ' ' + etat.unite + (n > 1 && !/s$/.test(etat.unite) ? 's' : ''); }
  let ecartHorloge = 0;
  function serveurMaintenant() { return Date.now() / 1000 - ecartHorloge; }

  // ---------------- Préalables : soirée et prénom ----------------
  if (!s) {
    titre('Pas de soirée');
    const c = carte('Rejoins d’abord une soirée');
    c.appendChild(el('p', {}, 'L’enquête se joue pendant une soirée : crée-la ou rejoins-la sur l’accueil, puis reviens ici.'));
    const l = el('div', { className: 'ligne' }); l.style.marginTop = '12px';
    l.appendChild(el('a', { className: 'bouton', href: 'index.html', target: dansJeu ? '_top' : '_self' }, 'Aller à l’accueil'));
    c.appendChild(l);
    return;
  }
  if (!monNom) {
    titre('Ton prénom');
    const c = carte('Comment t’appelles-tu ?');
    const l = el('div', { className: 'ligne' });
    const champ = el('input', { type: 'text', maxLength: 16, placeholder: 'Ton prénom' });
    const ok = el('button', { type: 'button' }, 'Entrer');
    ok.addEventListener('click', () => { if (Soiree.definirNom(champ.value)) location.reload(); });
    l.append(champ, ok);
    c.appendChild(l);
    return;
  }

  // ---------------- Connexion « soirée » ----------------
  function seConnecter() {
    clearTimeout(minuteur); minuteur = null;
    const url = Soiree.SERVEURS[s.serveur].ws + '/ws-soiree/' + s.code + '/' + encodeURIComponent(monNom);
    const socket = new WebSocket(url);
    ws = socket;
    dernierSignal = Date.now();
    socket.onopen = () => { if (ws !== socket) return; tentatives = 0; elErreur.textContent = ''; };
    socket.onmessage = (e) => {
      if (ws !== socket) return;
      dernierSignal = Date.now();
      recevoir(JSON.parse(e.data), socket);
    };
    socket.onclose = () => { if (ws === socket) reconnecter(); };
  }
  function reconnecter() {
    if (minuteur) return;
    tentatives++;
    if (tentatives > 1) elErreur.textContent = 'Connexion perdue, reconnexion…';
    minuteur = setTimeout(() => { minuteur = null; seConnecter(); }, Math.min(1000 * tentatives, 5000));
  }
  setInterval(() => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    try { ws.send('{"type":"ping"}'); } catch (e) { /* elle se fermera */ }
    if (!document.hidden && Date.now() - dernierSignal > 15000) seConnecter();
  }, 5000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (!ws || ws.readyState > 1) seConnecter();
    else envoyer({ type: 'soiree_etat' });
  });

  function recevoir(msg, socket) {
    switch (msg.type) {
      case 'pong': return;
      case 'remplace':
        ws = null; try { socket.close(); } catch (e) {}
        cacherCadre();
        titre('Ouverte ailleurs');
        carte('Ton enquête est ouverte sur un autre écran')
          .appendChild(el('p', {}, 'Ferme cet onglet, ou recharge la page pour la reprendre ici.'));
        return;
      case 'soiree_couches':
        couches = msg.couches || [];
        if (!couches.includes('enq')) { etat = null; afficher(); }
        return;
      case 'enq_pack':
        pack = msg; appliquerPalette(msg.palette || {}); afficher(); return;
      case 'enq_etat': {
        if (!couches.includes('enq')) couches.push('enq');
        const fini = msg.phase === 'fin' && (!etat || etat.phase !== 'fin');
        etat = msg;
        ecartHorloge = Date.now() / 1000 - msg.maintenant;
        if (fini) onglet.fin = 'recit';
        afficher(); return;
      }
      case 'enq_moi':
        moi = msg; afficher(); return;
      case 'enq_erreur':
        erreur(msg.message); return;
      case 'enq_annulee':
        etat = null; couches = couches.filter((c) => c !== 'enq'); afficher(); return;
      case 'enq_texte':
        montrerLettre(msg); return;
      case 'enq_gorgee':
        toast('🍺 Bois ' + unite(msg.nombre) + ' : ' + msg.raison.toLowerCase() + '.', 'gorgee', 7000); return;
      case 'enq_pe':
        toast('+' + msg.gain + ' PE (' + msg.raison + ') · total ' + msg.total, '', 4000); return;
      case 'enq_nouvel_indice':
        toast('📜 Un pli t’attend · ' + msg.source, '', 4000); return;
      case 'enq_verdict':
        montrerVerdict(msg); return;
    }
  }

  // ---------------- Cadre : bandeau et onglets ----------------
  function cacherCadre() {
    ecran.textContent = '';
    elEtat.classList.add('masque');
    elOnglets.classList.add('masque');
  }
  function onglets(phase, liste) {
    elOnglets.textContent = '';
    elOnglets.classList.remove('masque');
    if (!liste.some((o) => o.id === onglet[phase])) onglet[phase] = liste[0].id;
    liste.forEach((o) => {
      const b = el('button', { type: 'button', className: o.id === onglet[phase] ? 'actif' : '' });
      b.dataset.onglet = o.id;
      b.append(el('span', { className: 'ico' }, o.ico), o.titre);
      if (o.pastille) b.appendChild(el('span', { className: 'pastille' }, String(o.pastille)));
      b.addEventListener('click', () => { onglet[phase] = o.id; rendu = ''; afficher(); ecran.scrollTop = 0; });
      elOnglets.appendChild(b);
    });
    return onglet[phase];
  }

  // ---------------- Écrans ----------------
  let rendu = '';
  function afficher() {
    // On ne redessine pas un écran identique : un appui long ou une saisie
    // en cours ne doivent pas être interrompus.
    const cle = JSON.stringify([couches.includes('enq'), etat && Object.assign({}, etat, { maintenant: 0 }), moi, pack && pack.id, onglet]);
    if (cle === rendu) return;
    rendu = cle;
    const actif = document.activeElement && document.activeElement.id ? document.activeElement : null;
    const garde = actif ? { id: actif.id, valeur: actif.value, debut: actif.selectionStart, fin: actif.selectionEnd } : null;
    const defilement = ecran.scrollTop;
    arreterManoir();
    cacherCadre();
    if (!couches.includes('enq') || !etat) ecranAucune();
    else if (pack && moi) ({ lobby: ecranLobby, ouverture: ecranOuverture, enquete: ecranEnquete, fin: ecranFin }[etat.phase] || ecranAucune)();
    ecran.scrollTop = defilement;
    if (garde) {
      const e = document.getElementById(garde.id);
      if (e) { e.value = garde.valeur; e.focus(); try { e.setSelectionRange(garde.debut, garde.fin); } catch (x) { /* pas un champ texte */ } }
    }
  }

    titre('Enquête', 'Soirée ' + s.code);
    const c = carte('Un meurtre cette nuit ?');
    c.appendChild(el('p', {}, 'L’enquête tourne pendant toute la soirée, en parallèle des autres jeux. Chaque victoire rapporte des indices ; l’un de vous est le tueur.'));

    l.appendChild(b);
    c.appendChild(l);

  // ---------------- Ouverture ----------------

    titre(pack.nom, 'Enquête');

    const DUREE = 25;   // duree_ouverture de enquete_config.json
    const debut = etat.ouverture_fin_a - DUREE;

      setTimeout(() => p.classList.add('vue'), Math.max(0, (quand - serveurMaintenant()) * 1000) + 60);
    });
    if (!ouvertureLancee) {

    }
    const nonLus = (moi.archive || []).filter((e) => !e.lu).length;
    const o = onglets('enquete', [
      { id: 'plan', ico: '🗺️', titre: 'Plan' },
      { id: 'indices', ico: '📜', titre: 'Indices', pastille: nonLus || null },
      { id: 'notes', ico: '📝', titre: 'Notes' },

      { id: 'fil', ico: pack.narrateur.icone, titre: pack.narrateur.nom },
    ]);
    if (!moi.inscrit && (o === 'indices' || o === 'notes' || o === 'accuser')) {
      carte().appendChild(el('p', {}, 'Tu n’es pas inscrit à cette enquête : tu peux suivre, mais pas jouer.'));
    } else ({ plan: ongletPlan, indices: ongletIndices, notes: ongletNotes, accuser: ongletAccuser, fil: ongletFil }[o])();

    clearInterval(minuteurSec);
    const maj = () => {
      chrono.textContent = mmss(etat.fin_a - serveurMaintenant());
      document.querySelectorAll('[data-relire]').forEach((b) => {
        const reste = (moi.consultation_possible_a || 0) - serveurMaintenant();
        b.disabled = reste > 0;
        b.textContent = reste > 0 ? 'Relire dans ' + mmss(reste) : 'Relire (' + unite(etat.gorgees_consultation) + ')';
      });
      document.querySelectorAll('[data-accuser]').forEach((b) => {
        const reste = (moi.prochaine_accusation_a || 0) - serveurMaintenant();
        const complet = accusation.lieu && accusation.arme && accusation.suspect;
        b.disabled = reste > 0 || !complet;
        b.textContent = reste > 0 ? 'Attendre ' + mmss(reste) : 'Accuser';
      });
    };
    maj();
    minuteurSec = setInterval(maj, 1000);
  }

  // --- Carnet local (jamais envoyé au serveur) ---
  // Il sert à noter ce qu'on a lu et ce que les autres ont DIT : tout y est
  // modifiable, il ne prouve donc rien. Seule l'archive fait foi.
  function cleCarnet() { return 'shield.carnet.' + s.code + '.' + Math.round(etat.ouverture_fin_a || 0); }
  function lireCarnet() {
    try { return JSON.parse(localStorage.getItem(cleCarnet()) || 'null') || { etats: {}, notes: [] }; }
    catch (e) { return { etats: {}, notes: [] }; }
  }
  function ecrireCarnet(c) { try { localStorage.setItem(cleCarnet(), JSON.stringify(c)); } catch (e) { /* tant pis */ } }
  const ETATS = ['', 'elimine', 'suspect'];
  function basculer(cle) {
    const c = lireCarnet();
    const suivant = ETATS[(ETATS.indexOf(c.etats[cle] || '') + 1) % ETATS.length];
    if (suivant) c.etats[cle] = suivant; else delete c.etats[cle];
    ecrireCarnet(c);
    return suivant;
  }

  // --- Plan SVG : les lieux du pack, cliquables ---
  // mode 'carnet' : un appui change l'état (inconnu, éliminé, suspect) ;
  // mode 'accuser' : un appui choisit le lieu ; mode 'fin' : le lieu du crime s'allume.
  const SVG = 'http://www.w3.org/2000/svg';
  function svg(balise, attrs) {
    const e = document.createElementNS(SVG, balise);
    Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v));
    return e;
  }
  function plan(mode, surChoix) {
    const carnet = lireCarnet();
    const racine = svg('svg', { viewBox: pack.plan.vue, class: 'plan' + (mode === 'accuser' ? ' petit' : ''), role: 'img', 'aria-label': 'Plan : ' + pack.nom });
    const defs = svg('defs');
    const motif = svg('pattern', { id: 'hachures', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
    motif.appendChild(svg('rect', { width: 8, height: 8, fill: 'rgba(0,0,0,0.35)' }));
    motif.appendChild(svg('line', { x1: 0, y1: 0, x2: 0, y2: 8, stroke: 'rgba(243,230,207,0.12)', 'stroke-width': 3 }));
    defs.appendChild(motif);
    racine.appendChild(defs);
    const [vx, vy, vw, vh] = pack.plan.vue.split(' ').map(Number);
    racine.appendChild(svg('rect', { x: vx + 3, y: vy + 3, width: vw - 6, height: vh - 6, rx: 14, class: 'murs' }));
    pack.lieux.forEach((l) => {
      const [x, y, w, h] = pack.plan.zones[l.id];
      const ouvert = etat.lieux.includes(l.id);
      let classe = 'zone';
      if (!ouvert) classe += ' fermee';
      else if (mode === 'fin') { if (etat.fin.solution.lieu === l.id) classe += ' crime'; else classe += ' elimine'; }
      else if (mode === 'accuser') { if (accusation.lieu === l.id) classe += ' choisi'; else if (carnet.etats['lieu:' + l.id]) classe += ' ' + carnet.etats['lieu:' + l.id]; }
      else if (carnet.etats['lieu:' + l.id]) classe += ' ' + carnet.etats['lieu:' + l.id];
      const g = svg('g', { class: classe });
      g.dataset.lieu = l.id;
      g.appendChild(svg('rect', { x, y, width: w, height: h, rx: 10 }));
      g.appendChild(svg('line', { x1: x + 8, y1: y + 8, x2: x + w - 8, y2: y + h - 8, class: 'barre' }));
      const ico = svg('text', { x: x + w / 2, y: y + h / 2 - 4, class: 'ico' }); ico.textContent = l.icone || '';
      const nom = svg('text', { x: x + w / 2, y: y + h / 2 + 16 }); nom.textContent = ouvert ? l.nom : 'Fermé';
      g.append(ico, nom);
      if (ouvert && mode !== 'fin') {
        g.addEventListener('click', () => {
          if (mode === 'accuser') surChoix(l.id);
          else { const etatZone = basculer('lieu:' + l.id); g.setAttribute('class', 'zone' + (etatZone ? ' ' + etatZone : '')); }
        });
      }
      racine.appendChild(g);
    });
    return racine;
  }
  function jetons(cat, elements, mode, choisi, surChoix) {
    const carnet = lireCarnet();
    const l = el('div', { className: 'jetons' });
    elements.forEach(([id, libelle]) => {
      const cle = cat + ':' + id;
      const b = el('button', { type: 'button', className: mode === 'accuser' && choisi === id ? 'choisi' : (carnet.etats[cle] || '') }, libelle);
      b.dataset[cat] = id;
      b.addEventListener('click', () => {
        if (mode === 'accuser') surChoix(id);
        else b.className = basculer(cle);
      });
      l.appendChild(b);
    });
    return l;
  }
  const listeSuspects = () => etat.joueurs.map((x) => [x.nom, joueurAvecIcone(x.nom)]);
  const listeArmes = () => etat.armes.map((id) => { const a = trouver('armes', id); return [id, (a ? a.icone + ' ' : '') + element('armes', id)]; });

  // --- Maison 3D (écran principal de l'enquête) ---
  // Une seule scène pour toute la partie : elle est rattachée à l'onglet à
  // chaque affichage (le redessin de l'écran ne la recrée pas) et mise en
  // pause dès qu'elle n'est plus visible.
  let manoir = null, manoirConteneur = null, manoirEnCours = null, manoirImpossible = false;
  let vue2D = false;
  try { vue2D = localStorage.getItem('shield.plan2d') === '1'; } catch (e) { /* tant pis */ }
  function preparerManoir() {
    if (manoir) return Promise.resolve(manoir);
    if (manoirEnCours) return manoirEnCours;
    manoirEnCours = import('./commun/manoir3d.js').then((mod) => {
      if (!mod.webglDisponible()) throw new Error('webgl');
      manoir = mod.creerManoir3D(manoirConteneur, pack, {
        surAppui: (id) => { basculer('lieu:' + id); majManoir(); },
      });
      return manoir;
    }).catch(() => { manoirImpossible = true; rendu = ''; afficher(); return null; });
    return manoirEnCours;
  }
  function majManoir() {
    if (!manoir || !etat) return;
    const carnet = lireCarnet();
    const etats = {};
    Object.entries(carnet.etats).forEach(([k, v]) => { if (k.startsWith('lieu:')) etats[k.slice(5)] = v; });
    manoir.majEtats(etats, etat.lieux, null);
    manoir.majPersonnages(etat.joueurs.map((j) => {
      const p = portrait(j.portrait) || {};
      return { nom: j.nom, couleur: p.couleur, icone: p.icone };
    }));
  }
  function arreterManoir() { if (manoir) manoir.arreter(); }
  // L'enquête ouverte par-dessus un jeu : le calque prévient quand il se ferme.
  window.addEventListener('message', (e) => {
    if (e.data === 'enquete:pause') arreterManoir();
    if (e.data === 'enquete:reprise' && manoir && etat && etat.phase === 'enquete' && onglet.enquete === 'plan' && manoirConteneur && manoirConteneur.isConnected) manoir.reprendre();
  });

  function ongletPlan() {
    if (!vue2D && !manoirImpossible) {
      if (!manoirConteneur) manoirConteneur = el('div', { className: 'plan3d' });
      ecran.appendChild(manoirConteneur);
      let b = manoirConteneur.querySelector('.bascule');
      if (!b) {
        b = el('button', { type: 'button', className: 'discret bascule' }, 'Vue 2D');
        b.addEventListener('click', () => { vue2D = true; try { localStorage.setItem('shield.plan2d', '1'); } catch (e) {} arreterManoir(); rendu = ''; afficher(); });
        manoirConteneur.appendChild(b);

      }
      preparerManoir().then((m) => { if (m && manoirConteneur.isConnected) { majManoir(); m.reprendre(); } });
    } else {
      if (!manoirImpossible) {
        const b = el('button', { type: 'button', className: 'discret bascule-plan' }, 'Vue 3D');
        b.addEventListener('click', () => { vue2D = false; try { localStorage.removeItem('shield.plan2d'); } catch (e) {} rendu = ''; afficher(); });
        ecran.appendChild(b);
      }
      ecran.appendChild(plan('carnet'));
    }
    const c = carte();
    c.appendChild(el('div', { className: 'etiquette' }, 'Suspects'));
    c.appendChild(jetons('suspect', listeSuspects(), 'carnet'));
    c.appendChild(el('div', { className: 'etiquette' }, 'Armes'));
    c.appendChild(jetons('arme', listeArmes(), 'carnet'));
    c.appendChild(el('div', { className: 'legende' }, 'Touche un lieu, un suspect ou une arme : éliminé, puis suspect, puis inconnu. Ton carnet reste sur ton téléphone.'));
  }

  function ongletIndices() {
    const t = carte();
    t.appendChild(el('p', {}, 'Un indice : ' + moi.cout_indice + ' PE · ' + moi.indices_heure + '/' + moi.indices_heure_max + ' cette heure.'));
    const l = el('div', { className: 'ligne' }); l.style.marginTop = '8px';
    const plein = moi.indices_heure >= moi.indices_heure_max || etat.dossier_epuise;
    const dem = el('button', { type: 'button', disabled: plein || moi.pe < moi.cout_indice }, 'Demander un indice');
    dem.addEventListener('click', () => envoyer({ type: 'enq_indice' }));
    const ach = el('button', { type: 'button', className: 'discret', disabled: plein }, 'Acheter (' + unite(etat.gorgees_achat) + ')');
    ach.addEventListener('click', () => { if (confirm('Acheter un indice contre ' + unite(etat.gorgees_achat) + ' ?')) envoyer({ type: 'enq_acheter' }); });
    l.append(dem, ach);
    t.appendChild(l);
    if (etat.dossier_epuise) t.appendChild(el('p', { style: 'margin-top:8px' }, 'Le dossier est épuisé : plus aucun indice à distribuer.'));

    (moi.archive || []).filter((e) => !e.lu).forEach((e) => {
      const c = carte('📜 Un pli pour toi');
      c.classList.add('pli');
      c.appendChild(el('p', {}, e.source + ' · reçu à ' + heure(e.recu_a) + '. Lecture libre une fois ; ensuite il ira dans ton archive.'));
      const b = el('button', { type: 'button' }, 'Ouvrir le pli');
      b.style.marginTop = '8px';
      b.addEventListener('click', () => envoyer({ type: 'enq_lire', id: e.id }));
      c.appendChild(b);
    });

    const lus = (moi.archive || []).filter((e) => e.lu);
    const a = carte('Ton archive');
    if (!lus.length) {
      a.appendChild(el('p', {}, 'Aucun indice rangé. Relire un indice demande d’attendre ' + Math.round(etat.timer_consultation / 60) +
        ' min depuis la dernière consultation, et coûte ' + unite(etat.gorgees_consultation) + '.'));
      return;
    }
    a.appendChild(el('p', { style: 'margin-bottom:4px' }, 'Seule preuve possible : montre ton écran en relisant. Même prix devant les autres.'));
    lus.slice().reverse().forEach((e) => {
      const ligne = el('div', { className: 'archive-ligne' });
      const txt = el('div', { className: 'txt' }, 'Indice n°' + e.id);
      if (e.tampon) txt.appendChild(el('span', { className: 'tampon' }, e.tampon === 'authentique' ? 'Authentique' : 'Falsifié'));
      txt.appendChild(el('span', {}, e.source + ' · ' + heure(e.recu_a)));
      const b = el('button', { type: 'button', className: 'discret' });
      b.dataset.relire = '1';
      b.addEventListener('click', () => {
        if (confirm('Relire cet indice ? Ça coûte ' + unite(etat.gorgees_consultation) + ' et relance le chrono.')) envoyer({ type: 'enq_consulter', id: e.id });
      });
      ligne.append(txt, b);
      a.appendChild(ligne);
    });
  }

  function ongletNotes() {
    const carnet = lireCarnet();
    const c = carte();
    c.appendChild(el('p', {}, 'Ce que tu as lu, ce qu’on t’a dit. Ton carnet reste sur ton téléphone ; il ne prouve rien.'));
    const zone = el('textarea', { id: 'note-texte', placeholder: 'Ta note…', maxLength: 300 });
    zone.style.marginTop = '8px';
    c.appendChild(zone);
    const l = el('div', { className: 'ligne' }); l.style.marginTop = '8px';
    const source = el('input', { type: 'text', id: 'note-source', placeholder: 'dit par… (facultatif)', maxLength: 20 });
    source.style.flex = '1 1 140px';
    const ajouter = el('button', { type: 'button', className: 'discret' }, 'Noter');
    ajouter.addEventListener('click', () => {
      const texte = zone.value.trim();
      if (!texte) return;
      const c2 = lireCarnet();
      c2.notes.unshift({ texte, source: source.value.trim(), t: Date.now() });
      ecrireCarnet(c2);
      zone.value = ''; source.value = '';
      document.activeElement && document.activeElement.blur();
      rendu = ''; afficher();
    });
    l.append(source, ajouter);
    c.appendChild(l);
    const liste = el('div', { className: 'notes-carnet' });
    carnet.notes.forEach((n, i) => {
      const d = el('div');
      const t = el('span', {}, n.texte);
      if (n.source) { t.appendChild(document.createElement('br')); t.appendChild(el('em', {}, 'dit par ' + n.source)); }
      const x = el('button', { type: 'button', className: 'discret' }, '✕');
      x.addEventListener('click', () => { const c2 = lireCarnet(); c2.notes.splice(i, 1); ecrireCarnet(c2); rendu = ''; afficher(); });
      d.append(t, x);
      liste.appendChild(d);
    });
    c.appendChild(liste);
  }

  // --- Accusation : on touche le lieu sur le plan, puis l'arme et le personnage ---
  function ongletAccuser() {
    const choisir = (cle) => (id) => { accusation[cle] = accusation[cle] === id ? null : id; rendu = ''; afficher(); };
    ecran.appendChild(plan('accuser', choisir('lieu')));
    const c = carte();
    c.appendChild(el('div', { className: 'etiquette' }, 'Avec quelle arme ?'));
    c.appendChild(jetons('arme', listeArmes(), 'accuser', accusation.arme, choisir('arme')));
    c.appendChild(el('div', { className: 'etiquette' }, 'Qui ?'));
    c.appendChild(jetons('suspect', listeSuspects(), 'accuser', accusation.suspect, choisir('suspect')));
    const complet = accusation.lieu && accusation.arme && accusation.suspect;
    c.appendChild(el('p', { style: 'margin-top:8px' }, 'On apprend combien d’éléments sont justes, pas lesquels. ' +
      'Échecs cumulés : ' + etat.echecs + '/' + etat.seuil_patience + ' ; au-delà, ' + pack.vocabulaire.tueur + ' gagne.'));
    const barre = el('div', { className: 'barre-accuser' });
    barre.appendChild(el('div', { className: 'resume' }, complet
      ? accusation.suspect + ', ' + elementLe('lieux', accusation.lieu) + ', ' + elementLe('armes', accusation.arme) + '.'
      : 'Touche un lieu, une arme, un personnage.'));
    const b = el('button', { type: 'button' }, 'Accuser');
    b.dataset.accuser = '1';
    b.addEventListener('click', () => {
      if (!complet) return;
      if (!confirm('Accuser ' + accusation.suspect + ' ? Si tu te trompes : ' + unite(prochainesGorgees()) + ' et un délai doublé.')) return;
      envoyer({ type: 'enq_accuser', suspect: accusation.suspect, arme: accusation.arme, lieu: accusation.lieu });
    });
    barre.appendChild(b);
    if ((moi.accusations || []).length) {
      const h = carte('Tes accusations');
      moi.accusations.slice().reverse().forEach((x) => {
        h.appendChild(el('p', {}, heure(x.t) + ' · ' + x.suspect + ', ' + element('lieux', x.lieu) + ', ' + element('armes', x.arme) +
          ' : ' + x.justes + ' juste' + (x.justes > 1 ? 's' : '') + ' sur 3'));
      });
    }
    ecran.appendChild(barre);
  }
  function prochainesGorgees() {
    const echecs = (moi.accusations || []).filter((x) => x.justes < 3).length;
    return [2, 4, 6][Math.min(echecs, 2)];
  }

  function ongletFil() {
    const c = carte();
    c.classList.add('fil');
    const j = (etat.journal || []).slice().reverse();
    if (!j.length) c.appendChild(el('p', {}, 'Rien à signaler pour l’instant.'));
    j.forEach((x) => { const p = el('p'); p.append(el('small', {}, heure(x.t)), x.texte); c.appendChild(p); });
  }

  // ---------------- Fin ----------------
  function ecranFin() {
    clearInterval(minuteurSec);
    titre(pack.nom, 'Enquête close');
    const f = etat.fin;
    const o = onglets('fin', [{ id: 'recit', ico: '📖', titre: 'Dénouement' }, { id: 'recap', ico: '📋', titre: 'Récapitulatif' }]);
    if (o === 'recit') {
      ecran.appendChild(plan('fin'));
      const majuscule = (t) => t.charAt(0).toUpperCase() + t.slice(1);
      const c = carte(majuscule(f.vainqueur === 'tueur' ? pack.vocabulaire.tueur + ' l’emporte' : pack.vocabulaire.detective + ' : ' + f.detective));
      const arme = trouver('armes', f.solution.arme);
      c.appendChild(el('p', { className: 'resume' }, joueurAvecIcone(f.solution.tueur) + ' · ' + (arme ? arme.icone + ' ' : '') +
        element('armes', f.solution.arme) + ' · ' + element('lieux', f.solution.lieu)));
      c.appendChild(el('p', { className: 'recit' }, f.recit));
      (f.recap.gorgees || []).forEach((g) => c.appendChild(el('p', { style: 'margin-top:8px;color:var(--texte)' }, '🍺 ' + g.qui + ' ' + g.action + ' ' + unite(g.nombre) + '.')));
    } else {
      const a = carte('Accusations');
      if (!f.recap.accusations.length) a.appendChild(el('p', {}, 'Aucune accusation.'));
      else {
        const t = el('table', { className: 'recap' });
        t.appendChild(el('tr')).append(el('th', {}, 'Qui'), el('th', {}, 'Accusation'), el('th', {}, 'Justes'));
        f.recap.accusations.forEach((x) => {
          const tr = el('tr');
          tr.append(el('td', {}, x.nom + (x.par_le_tueur ? ' (bluff)' : '')),
            el('td', {}, x.suspect + ', ' + element('lieux', x.lieu) + ', ' + element('armes', x.arme)), el('td', {}, x.justes + '/3'));
          t.appendChild(tr);
        });
        a.appendChild(t);
      }
      const i = carte('Indices reçus');
      const t = el('table', { className: 'recap' });
      t.appendChild(el('tr')).append(el('th', {}, 'Joueur'), el('th', {}, 'Reçus'), el('th', {}, 'Faux'));
      f.recap.indices.forEach((x) => { const tr = el('tr'); tr.append(el('td', {}, joueurAvecIcone(x.nom)), el('td', {}, String(x.recus)), el('td', {}, String(x.faux))); t.appendChild(tr); });
      i.appendChild(t);
    }
  }

  // ---------------- Lettre, verdict et alertes ----------------
  function montrerLettre(msg) {
    const voile = el('div', { className: 'voile' });
    const l = el('div', { className: 'lettre' });
    l.appendChild(el('div', { className: 'corps' }, msg.texte));
    l.appendChild(el('div', { className: 'meta' }, msg.source + ' · reçu à ' + heure(msg.recu_a) +
      (msg.tampon ? ' · ' + (msg.tampon === 'authentique' ? 'Authentique' : 'Falsifié') : '')));
    l.appendChild(el('div', { className: 'avis' }, msg.gratuit
      ? 'Lecture libre, une seule fois. Pour le relire plus tard, il faudra attendre le chrono et payer en ' + (etat ? etat.unite : 'gorgée') + 's.'
      : 'Relecture de l’archive.'));
    const b = el('button', { type: 'button' }, msg.gratuit ? 'Ranger dans l’archive' : 'Fermer');
    b.addEventListener('click', () => voile.remove());
    l.appendChild(b);
    voile.appendChild(l);
    document.body.appendChild(voile);
  }
  function montrerVerdict(msg) {
    accusation.lieu = accusation.arme = accusation.suspect = null;
    const voile = el('div', { className: 'voile' });
    const l = el('div', { className: 'lettre' });
    l.appendChild(el('div', { className: 'corps' }, msg.justes + ' élément' + (msg.justes > 1 ? 's' : '') + ' juste' + (msg.justes > 1 ? 's' : '') + ' sur 3.'));
    l.appendChild(el('div', { className: 'meta' }, msg.suspect + ', ' + element('lieux', msg.lieu) + ', ' + element('armes', msg.arme) + '.'));
    l.appendChild(el('div', { className: 'avis' }, 'Lesquels ? À toi de le déduire. Prochaine accusation à ' + heure(msg.prochaine_a) + '.'));
    const b = el('button', { type: 'button' }, 'Compris');
    b.addEventListener('click', () => voile.remove());
    l.appendChild(b);
    voile.appendChild(l);
    document.body.appendChild(voile);
  }
  let minuteurToast = null;
  function toast(texte, genre, duree) {
    let t = document.getElementById('toast');
    if (!t) { t = el('div', { id: 'toast', className: 'toast' }); t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.className = 'toast ' + (genre || '');
    t.textContent = texte;
    t.style.display = 'block';
    clearTimeout(minuteurToast);
    minuteurToast = setTimeout(() => { t.style.display = 'none'; }, duree || 4000);
  }

  seConnecter();
})();
</script>
</body>
</html>
