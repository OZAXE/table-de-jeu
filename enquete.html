<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Enquête</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<meta name="theme-color" content="#1a0b0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Exo+2:wght@500;700&family=Limelight&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Les couleurs viennent du pack de l'univers (palette) ; valeurs du Manoir par défaut. */
  :root {
    --fond: #1a0b0e;
    --surface: #2a1216;
    --accent: #c9a24a;
    --texte: #f3e6cf;
    --alerte: #b3261e;
    --doux: rgba(243, 230, 207, 0.66);
    --bord: rgba(201, 162, 74, 0.28);
    --titre: 'Cormorant Garamond', Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--fond); height: 100%; overflow: hidden; }
  /* Une seule page, sans défilement : bandeau en haut, contenu, onglets en bas.
     Épinglée aux bords de la zone visible (et non 100dvh, que certains
     Android en appli installée comptent plus haut que l'écran : les onglets
     du bas passaient sous la barre système). */
  body {
    color: var(--texte); font: 400 16px/1.45 'Outfit', system-ui, sans-serif;
    position: fixed; inset: 0; overflow: hidden; display: flex; flex-direction: column;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(201, 162, 74, 0.16), transparent 60%),
      radial-gradient(80% 50% at 100% 100%, rgba(179, 38, 30, 0.12), transparent 60%),
      var(--fond);
  }
  header {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) 14px 8px; max-width: 620px; width: 100%; margin: 0 auto;
  }
  header .retour { color: var(--doux); text-decoration: none; font-size: 0.85rem; border: 1px solid var(--bord); border-radius: 999px; padding: 5px 11px; white-space: nowrap; }
  header h1 { font: 700 1.35rem/1.05 var(--titre); flex: 1; min-width: 0; }
  header .aide { flex: none; width: 38px; height: 38px; padding: 0; border-radius: 50%; font-size: 1.05rem; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--bord); }
  /* Règles : sections dépliables */
  #regles .bienvenue { padding: 12px 14px; margin-bottom: 8px; border-radius: 14px; background: rgba(201, 162, 74, 0.14); border: 1px solid var(--accent); color: var(--texte); font-size: 0.92rem; }
  .regles details { border: 1px solid var(--bord); border-radius: 14px; background: color-mix(in srgb, var(--surface) 88%, transparent); margin-bottom: 8px; }
  .regles summary { cursor: pointer; padding: 12px 14px; font: 700 1.05rem/1.2 var(--titre); color: var(--accent); list-style: none; display: flex; gap: 8px; align-items: center; }
  .regles summary::-webkit-details-marker { display: none; }
  .regles summary::after { content: '＋'; margin-left: auto; color: var(--doux); font-family: 'Outfit', sans-serif; }
  .regles details[open] summary::after { content: '－'; }
  .regles .corps-regle { padding: 0 14px 12px; display: grid; gap: 6px; }
  .regles .corps-regle p, .regles .corps-regle li { color: var(--texte); font-size: 0.9rem; line-height: 1.45; }
  .regles .corps-regle ul { padding-left: 18px; display: grid; gap: 4px; }
  .regles .corps-regle b { color: var(--accent); font-weight: 600; }
  .regles table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  .regles td { padding: 5px 4px; border-top: 1px solid var(--bord); vertical-align: top; color: var(--texte); }
  .regles td:last-child { text-align: right; white-space: nowrap; color: var(--accent); }
  header h1 small { display: block; font: 500 0.7rem 'Outfit', sans-serif; color: var(--doux); letter-spacing: 0.05em; text-transform: uppercase; }
  .etat-jeu {
    flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px 8px; max-width: 620px; width: 100%; margin: 0 auto;
  }
  .etat-jeu { flex-wrap: wrap; }
  .resume-vitesse { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(0, 0, 0, 0.22); display: grid; gap: 4px; }
  .resume-vitesse p { font-size: 0.84rem; margin: 0 !important; }
  .a-boire { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .a-boire .verre { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 0.8rem;
    background: rgba(255, 107, 94, 0.14); border: 1px solid #ff6b5e; animation: arrivee 0.4s ease-out; }
  .a-boire .verre.moi { background: rgba(255, 107, 94, 0.3); font-weight: 700; }
  .a-boire .verre button { padding: 3px 9px; font-size: 0.78rem; }
  .retirer-bot { margin-left: 4px; padding: 0 6px; font-size: 0.75rem; line-height: 1.4; }
  .etat-jeu .handicap { color: #ff9a8e; font-size: 0.82rem; font-weight: 700; }
  .evenement-bande { flex-basis: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px;
    background: rgba(201, 162, 74, 0.14); border: 1px solid var(--accent); font-size: 0.85rem; animation: arrivee 0.5s ease-out; }
  .evenement-bande .txt { flex: 1; min-width: 0; }
  .evenement-bande b { display: block; color: var(--accent); font: 700 1rem/1.2 var(--titre); }
  .evenement-bande .reste { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; }
  .evenement-bande button { padding: 6px 10px; font-size: 0.8rem; }
  .evenement-bande .interroges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .evenement-bande .interroge { padding: 3px 8px; border-radius: 999px; background: rgba(0, 0, 0, 0.3); font-size: 0.78rem; }
  .evenement-bande .actions-interro { display: flex; flex-direction: column; gap: 6px; }
  .evenement-bande.coupure { background: rgba(0, 0, 0, 0.5); border-color: #6a7a9a; }
  .evenement-bande.alerte { background: rgba(179, 38, 30, 0.22); border-color: #ff6b5e; }
  @keyframes arrivee { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
  /* Effets sur le plan pendant un événement */
  .plan3d::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.6s; }
  body.evt-coupure .plan3d::after { opacity: 1; background: rgba(0, 0, 8, 0.72); animation: vacille 3.2s steps(1) infinite; }
  body.evt-coupure svg.plan { filter: brightness(0.35); }
  body.evt-alerte .plan3d::after { opacity: 1; background: radial-gradient(transparent 40%, rgba(179, 38, 30, 0.55)); animation: alerte 1.2s ease-in-out infinite; }
  body.evt-alerte svg.plan { animation: alerte 1.2s ease-in-out infinite; }
  body.evt-flash .plan3d::after { opacity: 1; background: rgba(255, 220, 150, 0.35); animation: eclat 1.4s ease-out forwards; }
  @keyframes vacille { 0%, 100% { opacity: 1; } 7% { opacity: 0.55; } 9% { opacity: 1; } 52% { opacity: 0.8; } }
  @keyframes alerte { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  @keyframes eclat { to { opacity: 0; } }
  .etat-jeu .chrono { font: 700 1.5rem/1 var(--titre); color: var(--accent); }
  .etat-jeu .pe { color: var(--doux); font-size: 0.9rem; flex: 1; }
  .etat-jeu .pe b { color: var(--texte); }
  .etat-jeu button { padding: 8px 12px; font-size: 0.85rem; }
  main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 14px 12px; max-width: 620px; width: 100%; margin: 0 auto; }
  nav.onglets {
    flex: none; display: flex; border-top: 1px solid var(--bord); background: rgba(10, 4, 6, 0.85);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.onglets button {
    flex: 1; background: none; border: 0; border-radius: 0; color: var(--doux); padding: 8px 2px 9px;
    display: grid; justify-items: center; gap: 1px; font: 600 0.7rem 'Outfit', sans-serif; position: relative;
  }
  nav.onglets button .ico { font-size: 1.25rem; line-height: 1.2; }
  nav.onglets button.actif { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
  nav.onglets .pastille { position: absolute; top: 4px; right: calc(50% - 22px); min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px;
    background: var(--alerte); color: #fff; font-size: 0.68rem; line-height: 17px; }

  .carte { background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--bord); border-radius: 18px; padding: 14px; margin-bottom: 10px; }
  .carte h2 { font: 700 1.25rem/1.2 var(--titre); margin-bottom: 6px; color: var(--accent); }
  .carte p { color: var(--doux); font-size: 0.93rem; }
  .carte p + p { margin-top: 6px; }
  .ligne { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ligne + .ligne { margin-top: 8px; }
  button, .bouton {
    border: 0; border-radius: 14px; padding: 11px 15px; cursor: pointer; text-decoration: none; display: inline-block;
    background: var(--accent); color: #1a0f05; font: 600 0.92rem 'Outfit', sans-serif; transition: transform 0.12s ease;
  }
  button:active { transform: scale(0.97); }
  button.discret { background: rgba(243, 230, 207, 0.08); color: var(--texte); border: 1px solid var(--bord); }
  button.puce { padding: 7px 11px; border-radius: 999px; font-size: 0.83rem; }
  button.puce.choisie { background: var(--accent); color: #1a0f05; border-color: transparent; }
  button:disabled { opacity: 0.45; cursor: default; transform: none; }
  input[type=text], select, textarea {
    border-radius: 12px; border: 1px solid var(--bord); background: rgba(0, 0, 0, 0.3); color: var(--texte);
    padding: 9px 11px; font: 500 0.93rem 'Outfit', sans-serif; min-width: 0;
  }
  textarea { width: 100%; min-height: 70px; resize: vertical; }
  label.case { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; padding: 5px 9px; border: 1px solid var(--bord); border-radius: 999px; }
  .etiquette { color: var(--doux); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 10px 0 5px; }
  .etiquette:first-child { margin-top: 0; }
  .erreur { position: fixed; left: 14px; right: 14px; top: max(54px, calc(env(safe-area-inset-top) + 44px)); z-index: 40; max-width: 560px; margin: 0 auto;
    background: #4a1410; border: 1px solid #ff6b5e; color: #ffd9d3; border-radius: 12px; padding: 9px 12px; font-size: 0.88rem; }
  .erreur:empty { display: none; }

  /* Portraits */
  .portraits { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .portrait { border-radius: 14px; padding: 8px 3px 6px; text-align: center; cursor: pointer; background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--bord); color: var(--texte); font: inherit; display: grid; justify-items: center; gap: 2px; }
  .portrait .visage { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 1.25rem;
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.12), 0 4px 12px rgba(0, 0, 0, 0.35); }
  .portrait .arch { font: 600 0.82rem/1.05 var(--titre); overflow-wrap: anywhere; hyphens: auto; }
  .portrait .qui { font-size: 0.68rem; color: var(--doux); min-height: 1em; }
  .portrait.pris { opacity: 0.5; cursor: default; }
  .portrait.moi { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; opacity: 1; }
  .joueurs { display: flex; flex-wrap: wrap; gap: 6px; }
  .joueurs span { background: rgba(243, 230, 207, 0.08); border-radius: 999px; padding: 5px 10px; font-size: 0.85rem; }

  /* Ouverture */
  .narration p { font: 500 1.28rem/1.33 var(--titre); color: var(--texte); opacity: 0; transform: translateY(6px); transition: opacity 0.9s ease, transform 0.9s ease; }
  .narration p.vue { opacity: 1; transform: none; }
  .narration p + p { margin-top: 12px; }
  .narrateur { display: flex; align-items: center; gap: 10px; color: var(--accent); font: 700 1.05rem var(--titre); margin-bottom: 10px; }
  .narrateur span { font-size: 1.5rem; }
  .eclair { position: fixed; inset: 0; pointer-events: none; background: #fff; opacity: 0; z-index: 70; }
  .eclair.flash { animation: eclair 1.6s ease-out; }
  @keyframes eclair { 0% { opacity: 0; } 4% { opacity: 0.55; } 8% { opacity: 0.05; } 12% { opacity: 0.35; } 100% { opacity: 0; } }

  /* Rôle : appui long */
  .bouton-role { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  .zone-role { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; border-radius: 18px; padding: 18px 14px; text-align: center; cursor: pointer;
    background: repeating-linear-gradient(45deg, rgba(201, 162, 74, 0.08) 0 12px, rgba(201, 162, 74, 0.02) 12px 24px); border: 1px dashed var(--bord); color: var(--doux); }
  .role-voile { position: fixed; inset: 0; z-index: 80; background: rgba(10, 4, 6, 0.96); display: none; place-items: center; padding: 24px; text-align: center; pointer-events: none; }
  .role-voile.ouvert { display: grid; pointer-events: auto; }
  .role-voile .titre-role { font: 700 2rem/1.1 var(--titre); color: var(--accent); margin-bottom: 10px; }
  .role-voile.tueur .titre-role { color: #ff6b5e; }
  .role-voile p { color: var(--texte); font-size: 1.05rem; max-width: 420px; }
  .role-voile p + p { margin-top: 8px; }
  /* Même zone pour tous : on glisse le doigt dessus et on lâche pour ouvrir son dossier */
  .zone-dossier { position: fixed; left: 24px; right: 24px; bottom: calc(28px + env(safe-area-inset-bottom)); padding: 16px; border: 1px dashed var(--accent);
    border-radius: 16px; color: var(--doux); font-size: 0.9rem; }
  .zone-dossier.survol { background: rgba(201, 162, 74, 0.15); color: var(--texte); }
  /* Dossier (enquêteur) ou console (tueur) : même panneau */
  .dossier-panneau { position: fixed; inset: 0; z-index: 70; background: var(--fond); display: none; flex-direction: column; }
  .dossier-panneau.ouvert { display: flex; }
  .dossier-panneau header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 8px; }
  .dossier-panneau header h2 { flex: 1; font: 700 1.4rem/1.1 var(--titre); color: var(--accent); }
  .dossier-panneau .contenu { flex: 1; overflow-y: auto; padding: 4px 14px 18px; display: grid; gap: 10px; align-content: start; }
  .choix-ligne { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .choix-ligne button { padding: 8px 11px; font-size: 0.85rem; background: rgba(255, 255, 255, 0.06); color: var(--texte); border: 1px solid var(--bord); }
  .choix-ligne button.actif { background: var(--accent); color: #1a0b0e; border-color: var(--accent); }
  .choix-ligne button small { display: block; font-size: 0.68rem; opacity: 0.85; }
  .risque-faible { color: #7fc98a; } .risque-moyen { color: #e0b84a; } .risque-eleve { color: #ff7a6e; }
  .charges { font-size: 1.3rem; letter-spacing: 4px; }
  .fil p.rumeur { font-style: italic; color: #e6d3a8; }
  .plan .ping { fill: none; stroke: #ffd36b; stroke-width: 4; transform-box: fill-box; transform-origin: center; animation: ping 1.4s ease-out infinite; }
  @keyframes ping { from { transform: scale(0.4); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }

  /* Plan */
  .plan { width: 100%; max-height: 46dvh; display: block; margin: 0 auto 6px; touch-action: manipulation; }
  .plan .zone rect { fill: rgba(243, 230, 207, 0.06); stroke: var(--bord); stroke-width: 1.5; transition: fill 0.25s ease; }
  .plan .zone { cursor: pointer; }
  .plan .zone text { fill: var(--texte); font: 600 13px 'Cormorant Garamond', serif; text-anchor: middle; pointer-events: none; }
  .plan .zone .ico { font-size: 18px; }
  .plan .zone.elimine rect { fill: rgba(0, 0, 0, 0.4); }
  .plan .zone.elimine text { opacity: 0.4; }
  .plan .zone .barre { stroke: rgba(243, 230, 207, 0.35); stroke-width: 1.5; display: none; pointer-events: none; }
  .plan .zone.elimine .barre { display: inline; }
  .plan .zone.suspect rect { fill: rgba(179, 38, 30, 0.35); stroke: #ff6b5e; }
  .plan .zone.choisi rect { fill: rgba(201, 162, 74, 0.35); stroke: var(--accent); stroke-width: 3; }
  .plan .zone.fermee { cursor: default; }
  .plan .zone.fermee rect { fill: url(#hachures); stroke: rgba(243, 230, 207, 0.1); }
  .plan .zone.fermee text { opacity: 0.35; }
  .plan .zone.crime rect { fill: rgba(179, 38, 30, 0.55); stroke: #ff6b5e; stroke-width: 3; animation: crime 1.6s ease-in-out infinite; }
  @keyframes crime { 50% { fill: rgba(179, 38, 30, 0.25); } }
  .plan .murs { fill: none; stroke: rgba(201, 162, 74, 0.45); stroke-width: 3; }
  .jetons { display: flex; flex-wrap: wrap; gap: 5px; }
  .jetons button { padding: 5px 9px; border-radius: 10px; font-size: 0.82rem; background: rgba(243, 230, 207, 0.06); color: var(--texte); border: 1px solid var(--bord); }
  .jetons button.elimine { text-decoration: line-through; opacity: 0.45; }
  .jetons button.suspect { border-color: #ff6b5e; color: #ffb4a8; background: rgba(179, 38, 30, 0.2); }
  .jetons button.choisi { border-color: var(--accent); background: rgba(201, 162, 74, 0.3); color: var(--texte); }
  .legende { color: var(--doux); font-size: 0.75rem; margin-top: 6px; }
  /* Maison 3D : la scène prend le haut de l'onglet Plan */
  .plan3d { position: relative; height: 46dvh; min-height: 230px; border-radius: 18px; overflow: hidden; border: 1px solid var(--bord); margin-bottom: 8px; touch-action: none; background: var(--fond); }
  .plan3d canvas { width: 100%; height: 100%; display: block; }
  .plan3d .bascule { position: absolute; top: 8px; right: 8px; padding: 6px 10px; font-size: 0.78rem; border-radius: 999px; }
  .plan3d .aide3d { position: absolute; left: 10px; bottom: 8px; right: 10px; font-size: 0.72rem; color: var(--doux); pointer-events: none; text-shadow: 0 1px 3px #000; }
  .bascule-plan { display: block; margin: -2px 0 8px auto; padding: 6px 10px; font-size: 0.78rem; border-radius: 999px; }
  /* Accuser : plan réduit, et le résumé avec son bouton toujours visibles en bas */
  .plan.petit { max-height: 27dvh; }
  .barre-accuser { position: sticky; bottom: -12px; margin: 0 -14px -12px; padding: 8px 14px 12px; display: flex; align-items: center; gap: 10px;
    background: linear-gradient(transparent, var(--fond) 18%); }
  .barre-accuser .resume { flex: 1; margin: 0; font-size: 1rem; }
  .barre-accuser button { flex: none; }

  /* Indices, archive, notes, fil */
  .pli { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .archive-ligne { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--bord); }
  .archive-ligne:first-of-type { border-top: 0; }
  .archive-ligne .txt { flex: 1; min-width: 0; font-size: 0.9rem; }
  .archive-ligne .txt span { display: block; color: var(--doux); font-size: 0.78rem; }
  .archive-ligne button { padding: 7px 11px; font-size: 0.82rem; white-space: nowrap; }
  .tampon { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 6px; font-size: 0.72rem; border: 1px solid currentColor; }
  .tampon.authentique { color: #7fc98a; }
  .tampon.falsifie { color: #ff7a6e; }
  .archive-ligne .actions { display: flex; flex-direction: column; gap: 6px; }
  .notes-carnet { display: grid; gap: 6px; margin-top: 8px; }
  .notes-carnet div { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9rem; background: rgba(0, 0, 0, 0.2); border-radius: 10px; padding: 8px 10px; }
  .notes-carnet div span { flex: 1; overflow-wrap: anywhere; }
  .notes-carnet div em { color: var(--doux); font-style: normal; font-size: 0.8rem; }
  .notes-carnet button { padding: 2px 8px; font-size: 0.8rem; }
  .fil p { font-size: 0.9rem; padding: 6px 0; border-top: 1px solid var(--bord); color: var(--texte); }
  .fil p:first-of-type { border-top: 0; }
  .fil p small { color: var(--doux); margin-right: 6px; }
  .resume { font: 600 1.1rem/1.3 var(--titre); color: var(--texte); margin: 8px 0; }
  .recit { font: 500 1.22rem/1.38 var(--titre); color: var(--texte); }
  table.recap { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.recap td, table.recap th { padding: 6px 4px; border-top: 1px solid var(--bord); text-align: left; vertical-align: top; }
  table.recap th { color: var(--doux); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; }

  /* Lettre et alertes */
  .voile { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.72); display: grid; place-items: center; padding: 20px; }
  .lettre { position: relative; overflow: hidden; max-width: 460px; width: 100%; background: #f1e3c4; color: #2a1a10; border-radius: 6px; padding: 24px 20px 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
  .lettre .corps { font: 600 1.4rem/1.35 var(--titre); }
  .lettre .meta { margin-top: 12px; font-size: 0.82rem; color: #6b5440; }
  .lettre .avis { margin-top: 8px; font-size: 0.85rem; color: #6b5440; }
  .lettre button { margin-top: 14px; background: #2a1a10; color: #f1e3c4; }
  .lettre .choix { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .lettre .choix button.discret { background: transparent; color: #2a1a10; border: 1px solid #2a1a10; }
  .lettre h3 { font: 700 1.3rem/1.2 var(--titre); margin-bottom: 8px; }
  /* Tampon d'expertise : frappé en travers de la lettre */
  .cachet { position: absolute; bottom: 24px; right: 18px; padding: 3px 9px; border: 3px solid currentColor; border-radius: 8px;
    font: 800 1.05rem/1 system-ui, sans-serif; letter-spacing: 0.1em; transform: rotate(-12deg); opacity: 0.85; pointer-events: none;
    animation: frappe 0.45s cubic-bezier(.2, 1.6, .4, 1) both; }
  .cachet.authentique { color: #1f6b2e; }
  .cachet.falsifie { color: #a3161b; }
  /* Vignette de l'indice : photo de la pièce à conviction, épinglée sur la lettre */
  .vignette { display: flex; gap: 12px; align-items: stretch; margin: -4px 0 14px; }
  .vignette .photo { position: relative; flex: none; width: 118px; padding: 6px 6px 22px; background: #fbf6ea; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    transform: rotate(-3deg); }
  .vignette .photo .image { height: 96px; display: grid; place-items: center; font-size: 3.4rem; overflow: hidden;
    background: radial-gradient(circle at 50% 40%, rgba(255, 240, 210, 0.35), transparent 65%), var(--fond-photo, #3a2418);
    filter: sepia(0.25) contrast(1.05); }
  .vignette .photo .legende-photo { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font: 600 0.72rem/1.1 'Courier New', monospace; color: #3a2a1c;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .vignette .photo .bande { position: absolute; left: -8px; right: -8px; top: 74px; transform: rotate(-12deg); background: rgba(163, 22, 27, 0.88); color: #fff;
    font: 800 0.66rem/1 system-ui, sans-serif; letter-spacing: 0.14em; text-align: center; padding: 4px 0; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); }
  .vignette .photo .punaise { position: absolute; top: -6px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff8a7a, #a3161b); box-shadow: 0 2px 3px rgba(0, 0, 0, 0.4); }
  .vignette .dossier { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px;
    font: 600 0.74rem/1.3 'Courier New', monospace; color: #5a4430; text-transform: uppercase; letter-spacing: 0.04em; }
  .vignette .dossier b { font: 700 1.05rem/1.2 var(--titre); color: #2a1a10; text-transform: none; letter-spacing: 0; }
  .vignette svg.mini { width: 100%; max-height: 90px; }
  @keyframes frappe { from { transform: rotate(-12deg) scale(2.4); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 0.85; } }
  .toast { position: fixed; left: 14px; right: 14px; bottom: calc(66px + env(safe-area-inset-bottom)); z-index: 60; max-width: 520px; margin: 0 auto;
    background: #2a1216; border: 1px solid var(--accent); border-radius: 14px; padding: 12px 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
  .toast.gorgee { background: #4a1410; border-color: #ff6b5e; font-size: 1.05rem; }
  .masque { display: none !important; }
</style>
</head>
<body>
<div class="eclair" id="eclair"></div>
<header>
  <a class="retour" id="retour" href="index.html">← Soirée</a>
  <h1 id="titre"><small>Enquête</small>Chargement…</h1>
  <button type="button" class="aide masque" id="aide" aria-label="Règles du jeu" title="Règles">❓</button>
</header>
<div class="etat-jeu masque" id="etat-jeu"></div>
<main id="ecran"></main>
<nav class="onglets masque" id="onglets"></nav>
<div class="erreur" id="erreur" role="alert"></div>
<div class="role-voile" id="role-voile" aria-live="polite"></div>
<div class="dossier-panneau" id="dossier" role="dialog" aria-modal="true"></div>
<div class="dossier-panneau" id="regles" role="dialog" aria-modal="true" aria-label="Règles"></div>

<script src="commun/soiree.js"></script>
<script>
// Enquête : jeu fil conducteur de la soirée. Tout tient sur un écran : un
// bandeau en haut, le contenu de l'onglet choisi, la barre d'onglets en bas.
// La page parle au serveur par la connexion « soirée » (/ws-soiree),
// distincte de la place à une table : on l'ouvre par-dessus un jeu sans
// quitter sa partie.
(function () {
  const dansJeu = new URLSearchParams(location.search).get('dans') === '1';
  if (dansJeu) document.getElementById('retour').classList.add('masque');

  const ecran = document.getElementById('ecran');
  const elErreur = document.getElementById('erreur');
  const elTitre = document.getElementById('titre');
  const elEtat = document.getElementById('etat-jeu');
  const elOnglets = document.getElementById('onglets');
  const elRole = document.getElementById('role-voile');
  const elDossier = document.getElementById('dossier');
  const elRegles = document.getElementById('regles');
  const elAide = document.getElementById('aide');
  let dossierOuvert = false;
  // Console du tueur : choix en cours (gardés à travers les mises à jour).
  const sab = { sabotage: null, cible: null, categorie: null, mode: null, element: null };
  // Repères des rumeurs localisées sur le plan : lieu -> heure de fin.
  const pings = {};
  // Pénalités déjà signalées (pour ne pas refaire le toast à chaque mise à jour).
  const penalitesVues = new Set();

  const s = Soiree.actuelle();
  let monNom = Soiree.nom();
  let pack = null, etat = null, moi = null, couches = [];
  let ws = null, tentatives = 0, minuteur = null, dernierSignal = 0;
  let ouvertureLancee = false;
  // Onglet choisi par phase (gardé à travers les mises à jour).
  const onglet = { lobby: 'perso', enquete: 'plan', fin: 'recit' };
  // Accusation en préparation (lieu, arme, personnage).
  const accusation = { lieu: null, arme: null, suspect: null };

  function el(balise, attrs, texte) {
    const e = document.createElement(balise);
    Object.assign(e, attrs || {});
    if (texte != null) e.textContent = texte;
    return e;
  }
  function carte(titre, parent) {
    const c = el('section', { className: 'carte' });
    if (titre) c.appendChild(el('h2', {}, titre));
    (parent || ecran).appendChild(c);
    return c;
  }
  function envoyer(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }
  function titre(principal, sous) {
    elTitre.textContent = '';
    elTitre.appendChild(el('small', {}, sous || 'Enquête'));
    elTitre.append(principal);
  }
  function erreur(texte) {
    elErreur.textContent = texte;
    setTimeout(() => { if (elErreur.textContent === texte) elErreur.textContent = ''; }, 5000);
  }
  function appliquerPalette(p, police) {
    const r = document.documentElement.style;
    r.setProperty('--titre', "'" + (police || 'Cormorant Garamond') + "', Georgia, serif");
    ['fond', 'surface', 'accent', 'texte', 'alerte'].forEach((k) => { if (p[k]) r.setProperty('--' + k, p[k]); });
  }
  function portrait(id) { return pack && pack.portraits.find((p) => p.id === id); }
  function trouver(cle, id) { return pack && pack[cle].find((x) => x.id === id); }
  function element(cle, id) { const e = trouver(cle, id); return e ? e.nom : id; }
  function elementLe(cle, id) { const e = trouver(cle, id); return e ? (e.le || e.nom) : id; }
  function joueurAvecIcone(nom) {
    const j = etat.joueurs.find((x) => x.nom === nom);
    const p = j && portrait(j.portrait);
    return (p ? p.icone + ' ' : '') + nom;
  }
  function duree(sec) {
    const h = Math.floor(sec / 3600), mn = Math.round((sec % 3600) / 60);
    return h ? h + ' h' + (mn ? ' ' + String(mn).padStart(2, '0') : '') : mn + ' min';
  }
  function heure(t) {
    const d = new Date(t * 1000);
    return String(d.getHours()).padStart(2, '0') + 'h' + String(d.getMinutes()).padStart(2, '0');
  }
  function mmss(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
  }
  function unite(n) { return n + ' ' + etat.unite + (n > 1 && !/s$/.test(etat.unite) ? 's' : ''); }
  let ecartHorloge = 0;
  function serveurMaintenant() { return Date.now() / 1000 - ecartHorloge; }

  // ---------------- Préalables : soirée et prénom ----------------
  if (!s) {
    titre('Pas de soirée');
    const c = carte('Rejoins d’abord une soirée');
    c.appendChild(el('p', {}, 'L’enquête se joue pendant une soirée : crée-la ou rejoins-la sur l’accueil, puis reviens ici.'));
    const l = el('div', { className: 'ligne' }); l.style.marginTop = '12px';
    l.appendChild(el('a', { className: 'bouton', href: 'index.html', target: dansJeu ? '_top' : '_self' }, 'Aller à l’accueil'));
    c.appendChild(l);
    return;
  }
  if (!monNom) {
    titre('Ton prénom');
    const c = carte('Comment t’appelles-tu ?');
    const l = el('div', { className: 'ligne' });
    const champ = el('input', { type: 'text', maxLength: 16, placeholder: 'Ton prénom' });
    const ok = el('button', { type: 'button' }, 'Entrer');
    ok.addEventListener('click', () => { if (Soiree.definirNom(champ.value)) location.reload(); });
    l.append(champ, ok);
    c.appendChild(l);
    return;
  }

  // ---------------- Connexion « soirée » ----------------
  function seConnecter() {
    clearTimeout(minuteur); minuteur = null;
    const url = Soiree.SERVEURS[s.serveur].ws + '/ws-soiree/' + s.code + '/' + encodeURIComponent(monNom);
    const socket = new WebSocket(url);
    ws = socket;
    dernierSignal = Date.now();
    socket.onopen = () => { if (ws !== socket) return; tentatives = 0; elErreur.textContent = ''; };
    socket.onmessage = (e) => {
      if (ws !== socket) return;
      dernierSignal = Date.now();
      recevoir(JSON.parse(e.data), socket);
    };
    socket.onclose = () => { if (ws === socket) reconnecter(); };
  }
  function reconnecter() {
    if (minuteur) return;
    tentatives++;
    if (tentatives > 1) elErreur.textContent = 'Connexion perdue, reconnexion…';
    minuteur = setTimeout(() => { minuteur = null; seConnecter(); }, Math.min(1000 * tentatives, 5000));
  }
  setInterval(() => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    try { ws.send('{"type":"ping"}'); } catch (e) { /* elle se fermera */ }
    if (!document.hidden && Date.now() - dernierSignal > 15000) seConnecter();
  }, 5000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (!ws || ws.readyState > 1) seConnecter();
    else envoyer({ type: 'soiree_etat' });
  });

  function recevoir(msg, socket) {
    switch (msg.type) {
      case 'pong': return;
      case 'remplace':
        ws = null; try { socket.close(); } catch (e) {}
        cacherCadre();
        titre('Ouverte ailleurs');
        carte('Ton enquête est ouverte sur un autre écran')
          .appendChild(el('p', {}, 'Ferme cet onglet, ou recharge la page pour la reprendre ici.'));
        return;
      case 'soiree_couches':
        couches = msg.couches || [];
        if (!couches.includes('enq')) { etat = null; afficher(); }
        return;
      case 'enq_pack':
        if (pack && pack.id !== msg.id && manoir) { arreterManoir(); manoir.detruire(); manoir = null; manoirEnCours = null; manoirConteneur = null; }
        pack = msg; appliquerPalette(msg.palette || {}, msg.police); afficher(); return;
      case 'enq_etat': {
        if (!couches.includes('enq')) couches.push('enq');
        const fini = msg.phase === 'fin' && (!etat || etat.phase !== 'fin');
        // Pénalités des autres : un toast pour chaque nouvelle (la sienne a déjà son toast privé).
        (msg.penalites || []).forEach((x) => {
          if (penalitesVues.has(x.id)) return;
          penalitesVues.add(x.id);
          if (etat && x.nom !== monNom && !x.bu) toast('🍺 ' + x.nom + ' boit ' + unite(x.nombre) + ' · ' + x.raison.toLowerCase(), '', 5000);
        });
        etat = msg;
        ecartHorloge = Date.now() / 1000 - msg.maintenant;
        if (fini) onglet.fin = 'recit';
        afficher(); return;
      }
      case 'enq_moi':
        moi = msg; afficher(); return;
      case 'enq_erreur':
        erreur(msg.message); return;
      case 'enq_annulee':
        etat = null; couches = couches.filter((c) => c !== 'enq'); afficher(); return;
      case 'enq_texte':
        montrerLettre(msg); return;
      case 'enq_gorgee':
        if (!msg.nombre) toast('⏳ Plafond atteint : au lieu de boire, ' + Math.round(msg.handicap / 60) + ' min d’attente (archive et accusations) · ' + msg.raison.toLowerCase() + '.', 'gorgee', 8000);
        else toast('🍺 Bois ' + unite(msg.nombre) + ' : ' + msg.raison.toLowerCase() + '.' +
          (msg.handicap ? ' Plafond atteint : le reste devient ' + Math.round(msg.handicap / 60) + ' min d’attente.' : ''), 'gorgee', 8000);
        return;
      case 'enq_pe':
        toast('+' + msg.gain + ' PE (' + msg.raison + ') · total ' + msg.total, '', 4000); return;
      case 'enq_nouvel_indice':
        toast(msg.source === 'Témoin anonyme' ? '📜 Un témoin anonyme t’a glissé un pli' : '📜 Un pli t’attend · ' + msg.source, '', 4500); return;
      case 'enq_verdict':
        montrerVerdict(msg); return;
      case 'enq_rumeur':
        toast('🗣️ ' + msg.texte, '', 6000);
        if (msg.lieu) signalerLieu(msg.lieu);
        return;
      case 'enq_evenement':
        toast('⚡ ' + msg.nom + ' : ' + msg.texte, '', 6000);
        document.body.classList.remove('evt-flash'); void document.body.offsetWidth; document.body.classList.add('evt-flash');
        setTimeout(() => document.body.classList.remove('evt-flash'), 1500);
        return;
      case 'enq_evenement_fin':
        return;
      case 'enq_decouverte':
        montrerLettre(Object.assign({}, msg, { decouverte: true }));
        return;
      case 'enq_ecoute':
        montrerLettre(Object.assign({}, msg, { ecoute: true }));
        return;
    }
  }

  // ---------------- Cadre : bandeau et onglets ----------------
  function cacherCadre() {
    ecran.textContent = '';
    elEtat.classList.add('masque');
    elOnglets.classList.add('masque');
  }
  function onglets(phase, liste) {
    elOnglets.textContent = '';
    elOnglets.classList.remove('masque');
    if (!liste.some((o) => o.id === onglet[phase])) onglet[phase] = liste[0].id;
    liste.forEach((o) => {
      const b = el('button', { type: 'button', className: o.id === onglet[phase] ? 'actif' : '' });
      b.dataset.onglet = o.id;
      b.append(el('span', { className: 'ico' }, o.ico), o.titre);
      if (o.pastille) b.appendChild(el('span', { className: 'pastille' }, String(o.pastille)));
      b.addEventListener('click', () => { onglet[phase] = o.id; rendu = ''; afficher(); ecran.scrollTop = 0; });
      elOnglets.appendChild(b);
    });
    return onglet[phase];
  }

  // ---------------- Écrans ----------------
  let rendu = '';
  let rendreApresRole = false;
  let appuiRole = null;        // appui long en cours sur un bouton « Rôle »
  function afficher() {
    // On ne redessine pas un écran identique : un appui long ou une saisie
    // en cours ne doivent pas être interrompus.
    const cle = JSON.stringify([couches.includes('enq'), etat && Object.assign({}, etat, { maintenant: 0 }), moi, pack && pack.id, onglet]);
    if (cle === rendu) return;
    if (appuiRole) { rendreApresRole = true; return; }   // on redessinera quand le doigt sera levé
    rendu = cle;
    const actif = document.activeElement && document.activeElement.id ? document.activeElement : null;
    const garde = actif ? { id: actif.id, valeur: actif.value, debut: actif.selectionStart, fin: actif.selectionEnd } : null;
    const defilement = ecran.scrollTop;
    arreterManoir();
    cacherCadre();
    document.body.classList.remove('evt-coupure', 'evt-alerte');
    elAide.classList.toggle('masque', !(couches.includes('enq') && etat && pack));
    if (!couches.includes('enq') || !etat) ecranAucune();
    else if (pack && moi) ({ lobby: ecranLobby, ouverture: ecranOuverture, enquete: ecranEnquete, fin: ecranFin }[etat.phase] || ecranAucune)();
    ecran.scrollTop = defilement;
    if (dossierOuvert) rendreDossier();
    reglesPremiereFois();
    if (garde) {
      const e = document.getElementById(garde.id);
      if (e) { e.value = garde.valeur; e.focus(); try { e.setSelectionRange(garde.debut, garde.fin); } catch (x) { /* pas un champ texte */ } }
    }
  }

  function ecranAucune() {
    titre('Enquête', 'Soirée ' + s.code);
    const c = carte('Un meurtre cette nuit ?');
    c.appendChild(el('p', {}, 'L’enquête tourne pendant toute la soirée, en parallèle des autres jeux. Chaque victoire rapporte des indices ; l’un de vous est le tueur.'));
    c.appendChild(el('p', {}, 'De 4 à 12 joueurs. Celui qui la lance devient l’hôte et règle la partie.'));
    const l = el('div', { className: 'ligne' }); l.style.marginTop = '14px';
    const b = el('button', { type: 'button' }, 'Ouvrir une enquête');
    b.addEventListener('click', () => envoyer({ type: 'enq_creer' }));
    l.appendChild(b);
    c.appendChild(l);
  }

  // ---------------- Salle d'attente ----------------
  function ecranLobby() {
    titre(pack.nom, 'Enquête · ' + (pack.epoque || ''));
    const pret = etat.joueurs.length >= etat.joueurs_min && etat.joueurs.every((x) => x.portrait);
    const o = onglets('lobby', [
      { id: 'perso', ico: '🎭', titre: 'Personnage' },
      { id: 'joueurs', ico: '👥', titre: 'Joueurs', pastille: etat.joueurs.length },
      { id: 'reglages', ico: '⚙️', titre: 'Réglages' },
      { id: 'regles', ico: '📖', titre: 'Règles' },
    ]);
    if (o === 'perso') lobbyPersonnage();
    else if (o === 'joueurs') lobbyJoueurs(pret);
    else if (o === 'regles') contenuRegles(ecran);
    else lobbyReglages();
  }

  function lobbyPersonnage() {
    const c = carte();
    c.appendChild(el('p', {}, pack.ambiance + ' Victime : ' + pack.victime + '. Ton personnage porte ton prénom ; un portrait par joueur.'));
    const lire = el('button', { type: 'button', className: 'discret', style: 'margin-top:8px' }, '📖 Première fois ? Lis les règles');
    lire.addEventListener('click', () => { onglet.lobby = 'regles'; rendu = ''; afficher(); ecran.scrollTop = 0; });
    c.appendChild(lire);
    const g = el('div', { className: 'portraits' }); g.style.marginTop = '10px';
    pack.portraits.forEach((p) => {
      const qui = etat.joueurs.find((j) => j.portrait === p.id);
      const mien = qui && monNom.toLowerCase() === qui.nom.toLowerCase();
      const b = el('button', { type: 'button', className: 'portrait' + (qui ? ' pris' : '') + (mien ? ' moi' : '') });
      const visage = el('div', { className: 'visage' }, p.icone);
      visage.style.background = p.couleur;
      b.append(visage, el('div', { className: 'arch' }, p.archetype), el('div', { className: 'qui' }, qui ? qui.nom : ''));
      b.disabled = !!qui && !mien;
      b.addEventListener('click', () => { if (!qui) envoyer({ type: 'enq_portrait', portrait: p.id }); });
      g.appendChild(b);
    });
    c.appendChild(g);
    // Étape suivante, sans dépendre de la barre d'onglets du bas
    if (moi.portrait) {
      const suite = el('button', { type: 'button', className: 'suite-lobby' }, moi.hote ? 'Continuer : joueurs et lancement →' : 'Voir les joueurs →');
      suite.style.marginTop = '12px';
      suite.addEventListener('click', () => { onglet.lobby = 'joueurs'; rendu = ''; afficher(); ecran.scrollTop = 0; });
      c.appendChild(suite);
    }
  }

  function lobbyJoueurs(pret) {
    const voc = pack.vocabulaire.enqueteurs;   // « les invités » : l'article est dans le pack
    const j = carte(voc.charAt(0).toUpperCase() + voc.slice(1) + ' (' + etat.joueurs.length + '/' + etat.joueurs_max + ')');
    const lj = el('div', { className: 'joueurs' });
    etat.joueurs.forEach((x) => {
      const sp = el('span', {}, joueurAvecIcone(x.nom) + (x.bot ? ' 🤖' : ''));
      if (x.bot && moi.hote) {
        const r = el('button', { type: 'button', className: 'discret retirer-bot', title: 'Retirer' }, '✕');
        r.addEventListener('click', () => envoyer({ type: 'enq_bot_retirer', nom: x.nom }));
        sp.appendChild(r);
      }
      lj.appendChild(sp);
    });
    if (!etat.joueurs.length) lj.appendChild(el('span', {}, 'Personne pour l’instant'));
    j.appendChild(lj);
    j.appendChild(el('p', { style: 'margin-top:10px' }, 'Hôte : ' + etat.hote + (moi.hote ? ' (toi)' : '') + '. ' +
      (pret ? 'Tout le monde est prêt.' : 'Il faut au moins ' + etat.joueurs_min + ' joueurs, chacun avec son portrait.')));
    const la = el('div', { className: 'ligne' }); la.style.marginTop = '12px';
    if (moi.hote) {
      const b = el('button', { type: 'button', disabled: !pret }, 'Lancer l’enquête');

  const NOMS_DOSAGES = { doux: 'Doux', normal: 'Normal', corse: 'Corsé' };
  function texteDosage(d) { return NOMS_DOSAGES[d] + (etat.dosages[d] !== 1 ? ' ×' + String(etat.dosages[d]).replace('.', ',') : ''); }
  function textePlafond(p) { return p ? p + ' ' + etat.unite + (p > 1 && !/s$/.test(etat.unite) ? 's' : '') + ' par heure' : 'sans plafond'; }
  // Ce que la vitesse change, en clair
  function resumeVitesse(parent) {
    const v = etat.vitesses[etat.vitesse];
    const mn = (sec) => sec < 60 ? Math.round(sec) + ' s' : Math.round(sec / 60) + ' min';
    const lignes = [
      'Un indice coûte ' + v.pe_par_indice + ' PE ; relecture de l’archive toutes les ' + mn(v.timer_consultation) + '.',
      'Un témoin anonyme toutes les ' + mn(v.bonus_toutes) + ' environ.',
      'Accusation : ' + mn(v.delai_accusation) + ' d’attente, doublée à chaque échec ; ' + v.echecs_par_joueur + ' échec' + (v.echecs_par_joueur > 1 ? 's' : '') + ' par joueur et ' + pack.vocabulaire.tueur + ' gagne.',
      v.evenements + ' événement' + (v.evenements > 1 ? 's' : '') + ' de ' + mn(v.duree_evenement) + ' ; ' + v.lieux_armes + ' lieux et ' + v.lieux_armes + ' armes en jeu.',
      'Pénalités : ' + texteDosage(etat.dosage).toLowerCase() + (v.mult_gorgees !== 1 ? ', vitesse ×' + String(v.mult_gorgees).replace('.', ',') : '') +
        ', ' + textePlafond(etat.plafond) + (etat.plafond ? ' (au-delà : du temps d’attente au lieu de boire)' : '') +
        (etat.gorgees_publiques ? ', affichées à tous' : ', privées') + '.',
    ];
    if (v.pe_auto_heure) lignes.unshift('🧪 Mode démo pour tester seul : tout le monde gagne des PE tout seul (environ 1 toutes les ' +
      Math.round(3600 / v.pe_auto_heure) + ' s). Ajoute des joueurs fictifs 🤖 dans l’onglet Joueurs.');
    const c = el('div', { className: 'resume-vitesse' });
    lignes.forEach((t) => c.appendChild(el('p', {}, t)));
    parent.appendChild(c);
  }

  // ---------------- Ouverture ----------------
  function ecranOuverture() {
    titre(pack.nom, 'Enquête');
    const c = carte();
    const n = el('div', { className: 'narrateur' });
    n.append(el('span', {}, pack.narrateur.icone), pack.narrateur.nom + ', ' + pack.narrateur.role);
    c.appendChild(n);
    const texte = el('div', { className: 'narration' });
    const lignes = pack.ouverture.map((t) => el('p', {}, t));
    lignes.forEach((p) => texte.appendChild(p));
    c.appendChild(texte);
    // Les phrases apparaissent au rythme de l'ouverture, recalé sur l'horloge
    // du serveur (un joueur qui arrive en retard voit déjà le début).
    const DUREE = 25;   // duree_ouverture de enquete_config.json
    const debut = etat.ouverture_fin_a - DUREE;
    lignes.forEach((p, i) => {
      const quand = debut + (i * DUREE * 0.85) / lignes.length;
      setTimeout(() => p.classList.add('vue'), Math.max(0, (quand - serveurMaintenant()) * 1000) + 60);
    });
    if (!ouvertureLancee) {
      ouvertureLancee = true;
      const eclair = document.getElementById('eclair');
      eclair.classList.remove('flash'); void eclair.offsetWidth; eclair.classList.add('flash');
    }
    if (moi.inscrit) {
      const z = el('div', { className: 'zone-role' }, 'Maintiens le doigt appuyé ici pour voir ton rôle, à l’abri des regards.');
      brancherRole(z);
      ecran.appendChild(z);
    }
  }

  // **gras** dans les textes des règles
  function texteRiche(balise, texte) {
    const e = el(balise);
    String(texte).split(/(\*\*[^*]+\*\*)/).forEach((morceau) => {
      if (/^\*\*[^*]+\*\*$/.test(morceau)) e.appendChild(el('b', {}, morceau.slice(2, -2)));
      else if (morceau) e.appendChild(document.createTextNode(morceau));
    });
    return e;
  }
  function ouvrirRegles(premiere) {
    if (!pack || !etat) return;
    elRegles.textContent = '';
    const h = el('header');
    const fermerRegles = () => { elRegles.classList.remove('ouvert'); elRegles.textContent = ''; };
    const fermer = el('button', { type: 'button', className: 'discret' }, 'Fermer');
    fermer.addEventListener('click', fermerRegles);
    h.append(el('h2', {}, 'Règles'), fermer);
    const contenu = el('div', { className: 'contenu' });
    if (premiere === true) contenu.appendChild(el('p', { className: 'bienvenue' },
      '👋 Bienvenue ! Voici comment jouer. Tu retrouveras ces règles à tout moment avec le bouton ❓ en haut de l’écran.'));
    contenuRegles(contenu);
    if (premiere === true) {
      const go = el('button', { type: 'button' }, 'C’est parti');
      go.dataset.cestParti = '1';
      go.addEventListener('click', fermerRegles);
      contenu.appendChild(go);
    }
    elRegles.append(h, contenu);
    elRegles.classList.add('ouvert');
  }
  elAide.addEventListener('click', () => ouvrirRegles(false));
  // La toute première fois sur ce téléphone : les règles s'ouvrent d'elles-mêmes,
  // en salle d'attente ou pendant l'enquête (jamais pendant la scène d'ouverture).
  let reglesMontrees = false;
  function reglesPremiereFois() {
    if (reglesMontrees || !pack || !etat || !couches.includes('enq') || !['lobby', 'enquete'].includes(etat.phase)) return;
    let vues = false;
    try { vues = !!localStorage.getItem('shield.regles_vues'); } catch (e) { /* stockage bloqué : une fois par visite */ }
    reglesMontrees = true;
    if (vues) return;
    try { localStorage.setItem('shield.regles_vues', '1'); } catch (e) { /* tant pis */ }
    ouvrirRegles(true);
  }
