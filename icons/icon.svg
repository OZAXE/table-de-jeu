<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fond" cx="50%" cy="10%" r="95%">
      <stop offset="0" stop-color="#1b5f48"/><stop offset="1" stop-color="#0a2017"/>
    </radialGradient>
    <linearGradient id="biere" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e09a1c"/><stop offset=".45" stop-color="#f7c548"/><stop offset="1" stop-color="#d08612"/>
    </linearGradient>
    <linearGradient id="mousse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1e6cc"/>
    </linearGradient>
    <!-- Une chope, dessinée droite ; elle est inclinée plus bas -->
    <g id="chope">
      <!-- anse -->
      <path d="M58 40 h22 a34 34 0 0 1 34 34 v40 a34 34 0 0 1 -34 34 h-22" fill="none" stroke="#f3e3b8" stroke-width="20" stroke-linecap="round"/>
      <path d="M58 40 h22 a34 34 0 0 1 34 34 v40 a34 34 0 0 1 -34 34 h-22" fill="none" stroke="#c9a65e" stroke-opacity=".5" stroke-width="6"/>
      <!-- verre -->
      <rect x="-62" y="-10" width="124" height="190" rx="18" fill="#f6ecd2" fill-opacity=".35" stroke="#f6ecd2" stroke-width="8"/>
      <!-- bière -->
      <rect x="-52" y="4" width="104" height="166" rx="12" fill="url(#biere)"/>
      <!-- bulles -->
      <g fill="#fff4c9" fill-opacity=".8">
        <circle cx="-22" cy="130" r="6"/><circle cx="-10" cy="92" r="4.5"/><circle cx="-26" cy="62" r="3.5"/>
        <circle cx="20" cy="140" r="4"/><circle cx="26" cy="104" r="5"/>
      </g>
      <!-- reflet -->
      <rect x="-40" y="20" width="12" height="130" rx="6" fill="#fff" fill-opacity=".35"/>
      <!-- mousse qui déborde -->
      <path d="M-72 8 c-10 -30 18 -48 38 -38 c8 -26 50 -28 62 -6 c22 -14 52 4 44 32 c16 10 4 34 -14 30 c-6 12 -24 10 -28 0 c-8 22 -34 22 -40 4 c-12 10 -30 4 -30 -10 c-18 4 -40 -2 -32 -12 z" fill="url(#mousse)"/>
      <circle cx="40" cy="44" r="11" fill="url(#mousse)"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#fond)"/>
  <!-- ombre au sol -->
  <ellipse cx="256" cy="412" rx="150" ry="16" fill="#000" fill-opacity=".28"/>
  <!-- chope de gauche (anse à gauche) -->
  <g transform="translate(198 254) rotate(14) scale(-0.84 0.84)"><use href="#chope"/></g>
  <!-- chope de droite (anse à droite) -->
  <g transform="translate(314 254) rotate(-14) scale(0.84)"><use href="#chope"/></g>
  <!-- éclaboussures du choc -->
  <g fill="#fff6dc">
    <circle cx="256" cy="150" r="10"/><circle cx="230" cy="128" r="7"/><circle cx="284" cy="126" r="8"/>
    <circle cx="246" cy="106" r="5"/><circle cx="270" cy="102" r="4"/>
  </g>
  <g stroke="#ecd29a" stroke-width="7" stroke-linecap="round">
    <path d="M256 88 v-16"/><path d="M216 98 l-10 -12"/><path d="M296 98 l10 -12"/>
  </g>
</svg>
